name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 本地验证套件 (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 显示工具链版本
        run: |
          swift --version
          rustc --version
          cargo --version
      - name: 运行标准本地验证 (verify-local.sh)
        run: zsh scripts/verify-local.sh

  verify-windows:
    name: Rust 验证 (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 显示工具链版本
        run: |
          rustc --version
          cargo --version
      - name: Windows 前端结构冒烟
        run: node scripts/check-win-frontend.mjs
      - name: Rust 格式检查
        run: cargo fmt --manifest-path core/collector/Cargo.toml --all -- --check
      - name: Rust workspace 测试
        run: cargo test --manifest-path core/collector/Cargo.toml --workspace
      - name: Rust Clippy
        run: cargo clippy --manifest-path core/collector/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Windows 视图模型 crate 格式检查
        run: cargo fmt --manifest-path apps/win/viewmodel/Cargo.toml --all -- --check
      - name: Windows 视图模型 crate 测试
        run: cargo test --manifest-path apps/win/viewmodel/Cargo.toml
      - name: Windows 视图模型 crate Clippy
        run: cargo clippy --manifest-path apps/win/viewmodel/Cargo.toml --all-targets -- -D warnings
      - name: Windows 壳格式检查
        run: cargo fmt --manifest-path apps/win/src-tauri/Cargo.toml --all -- --check
      - name: Windows 壳 Clippy
        run: cargo clippy --manifest-path apps/win/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Windows 壳测试
        run: cargo test --manifest-path apps/win/src-tauri/Cargo.toml

  build-release-app:
    name: 构建测试版 App
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ripgrep (build-test-app.sh 前置依赖)
        run: brew install ripgrep
      - name: 构建并组装测试版 App
        run: zsh scripts/build-test-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bruce-test-app
          path: dist/
          if-no-files-found: error

  release:
    name: 发布草稿 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, build-release-app]
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ripgrep (build-test-app.sh 前置依赖)
        run: brew install ripgrep
      - name: 构建测试版 App
        run: zsh scripts/build-test-app.sh
      - name: 生成 SHA256 校验和
        run: |
          cd dist
          shasum -a 256 Bruce.zip > SHA256SUMS
      - name: 生成发布说明 (从 CHANGELOG)
        run: zsh scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
      - name: 创建草稿 Release 并上传 App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Bruce.zip \
            dist/SHA256SUMS \
            dist/release-notes-*.md \
            --draft \
            --title "Bruce $GITHUB_REF_NAME" \
            --notes-file dist/release-notes-${GITHUB_REF_NAME#v}.md

  release-windows:
    name: 发布 Windows 安装包
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify-windows, release]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 安装 tauri-cli
        run: cargo install tauri-cli --locked
      - name: 构建 NSIS 安装包 (内置 WebView2 Bootstrapper)
        run: cargo tauri build --bundles nsis
        working-directory: apps/win/src-tauri
      - name: "signtool 签名 (可选, 仅在仓库 secret 配置证书后启用)"
        if: false # 占位: 配置 SIGN_CERT_PFX / SIGN_CERT_PASSWORD secret 后替换为真实签名步骤
        run: echo "signtool sign /fd SHA256 <setup.exe>"
      - name: 生成 SHA256 校验和
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/win/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -FilePath "SHA256SUMS-windows.txt"
          "SHA256: $hash  $($setup.Name)"
      # 草稿 release 不在 /releases/tags/{tag} 端点返回 (404), gh release upload <tag>
      # 会报 release not found; 改走列表端点取 release id, 经 upload_url 直传资产。
      - name: 上传到既有草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/win/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { Write-Error "NSIS 安装包未找到"; exit 1 }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" | ConvertFrom-Json
          # 必须取 created_at 最新的同 tag 草稿: 失败 run 可能残留旧草稿,
          # 列表顺序不确定, First-1 可能命中残留把资产传丢。
          $release = $releases | Where-Object { $_.tag_name -eq $env:GITHUB_REF_NAME } | Sort-Object created_at -Descending | Select-Object -First 1
          Write-Host "上传目标 release id=$($release.id) created=$($release.created_at)"
          if (-not $release) { Write-Error "草稿 Release 未找到"; exit 1 }
          $uploadUrl = $release.upload_url -replace '\{.*$',''
          gh api --method POST "$($uploadUrl)?name=$($setup.Name)" -H "Content-Type: application/octet-stream" --input "$($setup.FullName)"
          gh api --method POST "$($uploadUrl)?name=SHA256SUMS-windows.txt" -H "Content-Type: application/octet-stream" --input "SHA256SUMS-windows.txt"

