name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 本地验证套件 (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 显示工具链版本
        run: |
          swift --version
          rustc --version
          cargo --version
      - name: 运行标准本地验证 (verify-local.sh)
        run: zsh scripts/verify-local.sh

  build-release-app:
    name: 构建测试版 App
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ripgrep (build-test-app.sh 前置依赖)
        run: brew install ripgrep
      - name: 构建并组装测试版 App
        run: zsh scripts/build-test-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bruce-test-app
          path: dist/
          if-no-files-found: error

  release:
    name: 发布草稿 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, build-release-app]
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ripgrep (build-test-app.sh 前置依赖)
        run: brew install ripgrep
      - name: 构建测试版 App
        run: zsh scripts/build-test-app.sh
      - name: 生成 SHA256 校验和
        run: |
          cd dist
          shasum -a 256 Bruce.zip > SHA256SUMS
      - name: 生成发布说明 (从 CHANGELOG)
        run: zsh scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
      - name: 创建草稿 Release 并上传 App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Bruce.zip \
            dist/SHA256SUMS \
            dist/release-notes-*.md \
            --draft \
            --title "Bruce $GITHUB_REF_NAME" \
            --notes-file dist/release-notes-${GITHUB_REF_NAME#v}.md

  # 正式版发布 (08-production-packaging-and-release.md §4)
  # 仅 tag v* 触发; 签名/公证凭证从仓库 Secret 读取, PR 永不接触
  release-sign:
    name: 正式版签名与公证 (Release)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify]
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      BRUCE_RELEASE_BUNDLE_ID: ${{ vars.BRUCE_RELEASE_BUNDLE_ID }}
      BRUCE_DEVELOPER_ID: ${{ secrets.BRUCE_DEVELOPER_ID }}
      BRUCE_NOTARY_KEY_ID: ${{ secrets.BRUCE_NOTARY_KEY_ID }}
      BRUCE_NOTARY_ISSUER_ID: ${{ secrets.BRUCE_NOTARY_ISSUER_ID }}
      BRUCE_NOTARY_KEY_PATH: ${{ secrets.BRUCE_NOTARY_KEY_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 ripgrep (build 脚本前置依赖)
        run: brew install ripgrep
      - name: 运行正式版构建 (含 verify-local + 签名 + 公证 + Gatekeeper)
        run: zsh scripts/build-release-app.sh "$GITHUB_REF_NAME"
      - name: 上传正式版产物
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-release
          path: dist/Bruce-*/
          if-no-files-found: error
      - name: 创建草稿 Release 并上传 zip + 校验和 + 说明
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_DIR="dist/Bruce-${GITHUB_REF_NAME#v}-macos"
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_DIR"/*.zip \
            "$RELEASE_DIR"/SHA256SUMS \
            "$RELEASE_DIR"/release-notes-*.md \
            --draft \
            --title "Bruce ${GITHUB_REF_NAME#v}" \
            --notes "正式版。Developer ID 签名 + notarization。人工确认后发布。"
