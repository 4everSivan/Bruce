name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 本地验证套件 (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 显示工具链版本
        run: |
          swift --version
          rustc --version
          cargo --version
      - name: 运行标准本地验证 (verify-local.sh)
        run: zsh scripts/verify-local.sh

  verify-windows:
    name: Rust 验证 (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 显示工具链版本
        run: |
          rustc --version
          cargo --version
      - name: Windows 前端结构冒烟
        run: node scripts/check-win-frontend.mjs
      # 发布/打包脚本只在 tag 场景真正执行; 用 AST 解析做语法门禁, 让每次 push 都能验证 (C036)
      - name: Windows 打包/发布脚本语法门禁 (AST 解析, 不执行)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @("scripts/build-win-app.ps1", "scripts/upload-win-release.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
          Write-Host "ok: Windows 打包/发布脚本语法合法"
      # 把「已修复的发布缺陷不得回归」固化为结构断言 (分页+展平 / 两端钉版 / 重跑幂等 / 脚本归属与门禁)
      - name: Windows 发布流水线契约测试
        run: node scripts/check-release-pipeline.mjs
      - name: Rust 格式检查
        run: cargo fmt --manifest-path core/collector/Cargo.toml --all -- --check
      - name: Rust workspace 测试
        run: cargo test --manifest-path core/collector/Cargo.toml --workspace
      - name: Rust Clippy
        run: cargo clippy --manifest-path core/collector/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Windows 视图模型 crate 格式检查
        run: cargo fmt --manifest-path apps/win/viewmodel/Cargo.toml --all -- --check
      - name: Windows 视图模型 crate 测试
        run: cargo test --manifest-path apps/win/viewmodel/Cargo.toml
      - name: Windows 视图模型 crate Clippy
        run: cargo clippy --manifest-path apps/win/viewmodel/Cargo.toml --all-targets -- -D warnings
      - name: Windows 壳格式检查
        run: cargo fmt --manifest-path apps/win/src-tauri/Cargo.toml --all -- --check
      - name: Windows 壳 Clippy
        run: cargo clippy --manifest-path apps/win/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Windows 壳测试
        run: cargo test --manifest-path apps/win/src-tauri/Cargo.toml

  build-release-app:
    name: 构建测试版 App
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ripgrep (build-test-app.sh 前置依赖)
        run: brew install ripgrep
      # Universal 2 (C057): 发布物必须同时含 arm64 与 x86_64, 否则 Intel Mac 无法启动。
      # x86_64-apple-darwin 是否预装随 runner 镜像而变, 故显式补齐 (幂等, 已装时立即返回)。
      - name: 补齐 x86_64 Rust target (Universal 2 前置)
        run: rustup target add x86_64-apple-darwin
      - name: 构建并组装测试版 App (Universal 2 与 DMG)
        run: zsh scripts/build-test-app.sh --universal --dmg
      - name: 校验产物为 Universal 2 与 DMG 有效性
        run: |
          # 两个二进制必须各自含双架构: App 本体与内置 Rust Collector 是分别构建的,
          # 任一退化为单架构都会让对应平台无法启动 (design/00 §3.3)。
          fail=0
          for bin in dist/Bruce.app/Contents/MacOS/BruceApp dist/Bruce.app/Contents/Resources/Bruce-collector; do
            archs=$(lipo -archs "$bin")
            echo "$bin -> $archs"
            echo "$archs" | tr ' ' '\n' | grep -qx arm64 || { echo "缺少 arm64: $bin"; fail=1; }
            echo "$archs" | tr ' ' '\n' | grep -qx x86_64 || { echo "缺少 x86_64: $bin"; fail=1; }
          done
          [ "$fail" -eq 0 ] || { echo "产物不是 Universal 2"; exit 1; }
          echo "Universal 2 校验通过"
          dmg=$(ls dist/Bruce-*.dmg | head -n 1)
          [ -s "$dmg" ] || { echo "DMG 产物缺失或为空"; exit 1; }
          hdiutil imageinfo "$dmg" >/dev/null || { echo "DMG 镜像结构损坏"; exit 1; }
          echo "DMG 镜像校验通过: $dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Bruce-test-app
          path: dist/
          if-no-files-found: error

  release:
    name: 发布草稿 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, build-release-app]
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ripgrep (build-test-app.sh 前置依赖)
        run: brew install ripgrep
      - name: 补齐 x86_64 Rust target (Universal 2 前置)
        run: rustup target add x86_64-apple-darwin
      - name: 构建测试版 App (Universal 2 与 DMG)
        run: zsh scripts/build-test-app.sh --universal --dmg
      - name: 生成 SHA256 校验和
        run: |
          cd dist
          shasum -a 256 Bruce.zip Bruce-*.dmg > SHA256SUMS
      - name: 生成发布说明 (从 CHANGELOG)
        run: zsh scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
      - name: 创建草稿 Release 并上传 App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Bruce.zip \
            dist/Bruce-*.dmg \
            dist/SHA256SUMS \
            dist/release-notes-*.md \
            --draft \
            --title "Bruce $GITHUB_REF_NAME" \
            --notes-file dist/release-notes-${GITHUB_REF_NAME#v}.md

  release-windows:
    name: 发布 Windows 安装包
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify-windows, release]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 钉版纪律: --locked 只钉 CLI 自身依赖树, 不钉 CLI 版本本身。不钉会在 tauri-cli 3.x
      # 稳定后跨大版本升级并冲掉已验证的 NSIS 打包链路。2.12.2 为 v0.11.5 发布
      # (run 38526082333) 实测通过的版本; 升版必须随下一次 tag 发布一并验证。
      - name: 安装 tauri-cli (钉版 2.12.2)
        run: cargo install tauri-cli --version "=2.12.2" --locked
      # T09: 更新签名门禁 —— 缺 TAURI_SIGNING_PRIVATE_KEY 时显式失败, 拒绝产出未签名
      # 安装包 (漏签一次该版本即无法被已装用户推送, 宁可发版失败不可发裸包)。
      - name: 构建 NSIS 安装包 (updater minisign 签名)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        working-directory: apps/win/src-tauri
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "缺少 TAURI_SIGNING_PRIVATE_KEY secret: 未签名产物禁止发布 (T09 更新清单门禁)"
            exit 1
          }
          cargo tauri build --bundles nsis
      - name: "signtool 签名 (可选, 仅在仓库 secret 配置证书后启用)"
        if: false # 占位: 配置 SIGN_CERT_PFX / SIGN_CERT_PASSWORD secret 后替换为真实签名步骤
        run: echo "signtool sign /fd SHA256 <setup.exe>"
      - name: 生成 SHA256 校验和
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "apps/win/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -FilePath "SHA256SUMS-windows.txt"
          "SHA256: $hash  $($setup.Name)"
      # 上传逻辑落在 scripts/upload-win-release.ps1: 该文件由 verify-windows 作业做
      # AST 语法门禁 (非 tag 场景也能验证), 见文件头部的纪律说明 (C036)。
      # T09: latest.json 也在该脚本内生成 —— 必须与它选定发布的同一个草稿同源 (不按 tag 回拉);
      # 脚本还要对从草稿取回的 Bruce.zip 做 minisign 签名, 故同样注入签名私钥。
      - name: 上传到既有草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/upload-win-release.ps1

