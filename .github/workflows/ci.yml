name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: 本地验证套件 (macOS 26)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 显示工具链版本
        run: |
          swift --version
          rustc --version
          cargo --version
      - name: 运行标准本地验证 (verify-local.sh)
        run: zsh scripts/verify-local.sh

  build-release-app:
    name: 构建测试版 App
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ripgrep (build-test-app.sh 前置依赖)
        run: brew install ripgrep
      - name: 构建并组装测试版 App
        run: zsh scripts/build-test-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bruce-test-app
          path: dist/
          if-no-files-found: error

  release:
    name: 发布草稿 Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, build-release-app]
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ripgrep (build-test-app.sh 前置依赖)
        run: brew install ripgrep
      - name: 构建测试版 App
        run: zsh scripts/build-test-app.sh
      - name: 生成 SHA256 校验和
        run: |
          cd dist
          shasum -a 256 Bruce.zip > SHA256SUMS
      - name: 生成发布说明 (从 CHANGELOG)
        run: zsh scripts/release-notes.sh "${GITHUB_REF_NAME#v}"
      - name: 创建草稿 Release 并上传 App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Bruce.zip \
            dist/SHA256SUMS \
            dist/release-notes-*.md \
            --draft \
            --title "Bruce $GITHUB_REF_NAME" \
            --notes-file dist/release-notes-${GITHUB_REF_NAME#v}.md
