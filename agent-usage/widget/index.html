<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; connect-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Agent 额度与用量</title>
<style>
  /* ============================================================
     信息分层:
       P0    今日总消耗 (数字)
       额度区  还剩多少 —— 只用一种组件: 量条 meter (余额除外)
       用量区  用了多少 —— 只用数字 + 柱状图, 不出现量条
     字号: 11 标题 / 13 名称与数值 / 11 说明 / 10 元信息
     ============================================================ */
  :root {
    --daimon-widget-host-safe-inline-end: 190px;
    --daimon-widget-host-safe-block-start: 44px;
    --fs-title: 11px;
    --fs-name: 13px;
    --fs-value: 13px;
    --fs-label: 11px;
    --fs-meta: 10px;
    --row-h: 30px;
    --pad-x: 16px;
    --bar-h: 5px;
    /* 宿主可能不提供部分语义色令牌：本地带兜底的别名 */
    --c-positive: var(--kimi-color-positive, #2f9e6e);
    --c-warning: var(--kimi-color-warning, #e8930c);
    --c-danger: var(--kimi-color-danger, #d94f4f);
    --c-accent: var(--kimi-color-accent, #2f6bff);
    --c-purple: #8b5cf6;
    /* Claude 风格字体: 英文 Times New Roman + 中文宋体，全组件统一 */
    --font-serif: "Times New Roman", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
    --font-kai: var(--font-serif);
  }
  /* ---------- Claude 官网风格主题: 米白书卷底 + 陶土橙 + 暖灰文字 ---------- */
  body {
    --kimi-color-text-primary: #1f1d1a;
    --kimi-color-text-secondary: #4d483d;
    --kimi-color-text-tertiary: #7a7362;
    --kimi-color-text-quaternary: #aaa493;
    --kimi-color-border: #e7e3d5;
    --kimi-color-surface-muted: #edeade;
    --kimi-color-accent: #d97757;
    background: #f7f5ee;
  }
  @media (prefers-color-scheme: dark) {
    body {
      --kimi-color-text-primary: #ece8dd;
      --kimi-color-text-secondary: #c8c2b1;
      --kimi-color-text-tertiary: #99927d;
      --kimi-color-text-quaternary: #6d6758;
      --kimi-color-border: #3d3a31;
      --kimi-color-surface-muted: #33302a;
      background: #232220;
    }
  }
  * { letter-spacing: 0; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--kimi-color-text-primary);
    font-family: var(--font-serif);
    font-variant-numeric: tabular-nums;
  }
  /* Claude 主题底色：必须晚于上面的 background: transparent 才能生效；
     --c-accent 也要直接声明在 body 上（:root 处的 var() 别名在 html 层就已解析，看不到 body 的令牌） */
  body { background: #f7f5ee; --c-accent: #d97757; }
  @media (prefers-color-scheme: dark) { body { background: #232220; } }
  [data-kimi-root] { box-sizing: border-box; inline-size: 100%; min-inline-size: 0; max-inline-size: 100%; overflow: visible; }
  [data-kimi-root] * { box-sizing: border-box; min-inline-size: 0; }
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p1"],
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p2"],
  html[data-daimon-size-tier="compact"] [data-kimi-priority="p3"] { display: none !important; }

  .kimi-host-safe-context { container-type: inline-size; padding: 4px 0 14px; }
  .kimi-host-safe-header {
    box-sizing: border-box;
    min-block-size: var(--daimon-widget-host-safe-block-start, 44px);
    padding-inline-end: var(--daimon-widget-host-safe-inline-end, 190px);
    display: flex; align-items: center; gap: 10px;
    padding-block: 6px 2px;
  }
  @container (max-width: 419px) {
    .kimi-host-safe-header {
      min-block-size: 0;
      padding-block-start: var(--daimon-widget-host-safe-block-start, 44px);
      padding-inline-end: 0;
    }
  }

  /* ---------- pixel 流场 ---------- */
  .kimi-pixel-stage { position: relative; isolation: isolate; overflow: hidden; }
  .kimi-pixel-background {
    position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    color: var(--kimi-color-text-tertiary);
    -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 96%);
            mask-image: linear-gradient(to bottom, black 50%, transparent 96%);
  }
  .kimi-pixel-background > canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; }
  .kimi-pixel-content { position: relative; z-index: 1; padding: 0 var(--pad-x); }
  html[data-daimon-size-tier="compact"] .kimi-pixel-background { opacity: .5; }

  header h1 {
    margin: 0; font-size: 16px; font-weight: 700;
    font-family: var(--font-serif); letter-spacing: .04em;
    color: var(--kimi-color-text-primary);
    display: flex; align-items: center; gap: 8px;
  }
  header h1::before {
    content: ""; flex: none;
    width: 3px; height: 14px; border-radius: 2px;
    background: var(--c-accent);
  }
  .live {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--fs-meta); font-weight: 600; color: var(--c-positive);
  }
  .live::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--c-positive);
    animation: blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
  .stamp {
    margin-left: auto; font-size: var(--fs-meta);
    font-family: var(--font-serif);
    color: var(--kimi-color-text-tertiary); white-space: nowrap;
  }

  /* ---------- P0 hero（Claude 编辑排版风） ---------- */
  .p0 { position: relative; z-index: 2; padding: 6px 2px 18px; }
  .p0 .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; font-weight: 600; letter-spacing: .18em;
    font-family: var(--font-serif); color: var(--c-accent);
  }
  .p0 .eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--c-accent); }
  .p0 .value-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .p0 output {
    display: inline-block; box-sizing: border-box;
    font-size: 54px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em;
    font-family: var(--font-serif);
    font-variant-numeric: tabular-nums;
  }
  .p0 .unit {
    font-size: 14px; font-family: var(--font-serif); font-style: italic;
    color: var(--kimi-color-text-tertiary);
  }
  .p0 .cost {
    font-size: 16px; font-weight: 600;
    font-family: var(--font-serif); color: var(--c-accent);
  }
  .p0 .p0-label { margin: 6px 0 0; font-size: 12px; font-family: var(--font-kai); color: var(--kimi-color-text-secondary); }
  .p0 .p0-label b { color: var(--c-accent); font-weight: 650; }
  .p0 .breakdown {
    margin: 12px 0 0; padding-top: 10px;
    border-top: 1px solid var(--kimi-color-border);
    display: flex; flex-wrap: wrap;
  }
  .p0 .breakdown .bd {
    display: flex; flex-direction: column; gap: 1px;
    padding: 0 14px; border-left: 1px solid var(--kimi-color-border);
  }
  .p0 .breakdown .bd:first-child { padding-left: 0; border-left: none; }
  .p0 .breakdown .bd-l {
    font-size: 9px; letter-spacing: .12em;
    color: var(--kimi-color-text-quaternary);
  }
  .p0 .breakdown b {
    font-family: var(--font-serif); font-size: 15px; font-weight: 600;
    color: var(--kimi-color-text-secondary); font-variant-numeric: tabular-nums;
  }

  /* ---------- 分区标题 ---------- */
  .sec-title {
    margin: 0; padding: 16px var(--pad-x) 8px;
    font-size: 16px; font-weight: 700;
    font-family: var(--font-serif); letter-spacing: .04em;
    color: var(--kimi-color-text-primary);
    border-top: 1px solid var(--kimi-color-border);
    display: flex; align-items: baseline; gap: 8px;
  }
  .sec-title::before {
    content: ""; flex: none; align-self: center;
    width: 3px; height: 14px; border-radius: 2px;
    background: var(--c-accent);
  }
  .sec-title .hint { font-size: 10px; font-weight: 400; text-transform: none; color: var(--kimi-color-text-quaternary); }


  /* ============================================================
     统一行 .row: [dot] [名称+徽标] [右值]
     ============================================================ */
  .rows { padding: 0 var(--pad-x); display: flex; flex-direction: column; }
  .row { padding: 6px 0 8px; border-bottom: 1px solid var(--kimi-color-border); }
  .row:last-child { border-bottom: none; }
  .row-head {
    display: grid; grid-template-columns: 10px minmax(0,1fr) auto;
    align-items: center; gap: 10px; min-height: var(--row-h);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; justify-self: center; background: var(--kimi-color-text-quaternary); }
  .dot.ok { background: var(--c-positive); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-positive) 18%, transparent); }
  .dot.warn { background: var(--c-warning); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-warning) 18%, transparent); }
  .dot.danger { background: var(--c-danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-danger) 18%, transparent); }
  .dot.dim { background: var(--kimi-color-text-quaternary); box-shadow: none; }

  .name { font-size: var(--fs-name); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; }
  .name .rank { font-family: var(--font-serif); font-size: var(--fs-meta); color: var(--kimi-color-text-quaternary); }
  .row.lead .name .rank { color: var(--c-accent); font-weight: 700; }
  .badge {
    flex: none; font-size: 9px; font-weight: 600; line-height: 1.7; padding: 0 5px; border-radius: 4px;
    color: var(--c-accent);
    border: 1px solid color-mix(in srgb, var(--c-accent) 45%, transparent);
  }
  .badge.plain { color: var(--kimi-color-text-tertiary); border-color: var(--kimi-color-border); font-weight: 500; }
  .value { font-size: var(--fs-value); font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .value small { display: block; font-size: var(--fs-meta); font-weight: 500; color: var(--kimi-color-text-quaternary); }
  .row.dim .name, .row.dim .value { color: var(--kimi-color-text-quaternary); font-weight: 500; }

  /* ---------- 分组行（如 Codex 多账号：总消耗 + 分账号子行） ---------- */
  .row.grp-head { border-bottom: none; padding-bottom: 2px; }
  .grp-body {
    margin: 2px 0 6px 8px; padding-left: 12px;
    border-left: 2px solid var(--kimi-color-border);
    display: flex; flex-direction: column;
  }
  .grp-body .row { border-bottom: none; padding: 5px 0; }
  .row.sub .name { font-weight: 500; font-size: var(--fs-label); }
  .grp-body .meters { padding-left: 17px; }

  /* ---------- 量条（只出现在额度区） ---------- */
  .meters { display: flex; gap: 14px; flex-wrap: wrap; padding: 2px 0 0 17px; }
  .meter.full { flex: 1 1 100%; }
  .meter { flex: 1 1 150px; min-width: 0; }
  .meter .m-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .meter .m-label { font-size: var(--fs-meta); color: var(--kimi-color-text-tertiary); white-space: nowrap; }
  .meter .m-val { font-size: var(--fs-meta); font-weight: 600; color: var(--kimi-color-text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter .m-track {
    position: relative; height: var(--bar-h); border-radius: 3px;
    background: var(--kimi-color-surface-muted); overflow: hidden;
  }
  .meter .m-fill {
    position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 3px;
    background: var(--kimi-color-text-quaternary);
    transition: width .8s cubic-bezier(.22,.8,.32,1);
  }
  .meter .m-fill.warn { background: var(--c-warning); }
  .meter .m-fill.danger { background: var(--c-danger); }
  .meter .m-sub { font-size: 9px; color: var(--kimi-color-text-quaternary); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .meter.na .m-label { color: var(--kimi-color-text-quaternary); }
  .row-extra {
    padding: 3px 0 0 17px;
    font-size: var(--fs-meta); color: var(--kimi-color-text-quaternary);
    display: flex; align-items: center; gap: 6px;
  }
  .row-extra::before {
    content: ""; width: 8px; height: 8px; border-radius: 2px; flex: none;
    border: 1px dashed var(--kimi-color-text-quaternary);
  }

  /* ---------- 用量区明细: 柱状图 + chips（不含量条） ---------- */
  .row-detail { display: none; padding: 8px 0 2px 17px; flex-direction: column; gap: 8px; }
  .strips { display: flex; gap: 16px; }
  .strip { flex: 1 1 0; min-width: 0; }
  .strip .s-label { font-size: 9px; color: var(--kimi-color-text-quaternary); margin-bottom: 4px; }
  .s-bars { display: flex; align-items: flex-end; gap: 2px; height: 24px; }
  .s-bars.tight { gap: 1px; height: 18px; }
  .s-bars .bar {
    flex: 1 1 0; min-width: 2px; border-radius: 1.5px 1.5px 0 0;
    background: var(--kimi-color-text-quaternary); opacity: .45;
    transition: height .5s cubic-bezier(.22,.8,.32,1);
  }
  .s-bars .bar.today, .s-bars .bar.now { background: var(--c-accent); opacity: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: var(--fs-meta); font-family: var(--font-serif);
    color: var(--kimi-color-text-tertiary);
    border: 1px solid var(--kimi-color-border); border-radius: 4px;
    padding: 1px 7px; white-space: nowrap;
  }
  .chip b { color: var(--kimi-color-text-secondary); font-weight: 600; }
  .chip.proj { font-family: var(--font-serif); border-style: dashed; }

  /* ---------- 组合堆叠图: 14 日全机消耗按 agent 拆分 ---------- */
  .combo-wrap { padding: 20px var(--pad-x) 10px; display: flex; gap: 14px; align-items: stretch; }
  .combo-wrap[hidden] { display: none; }
  .combo-main { flex: 1 1 0; min-width: 0; }
  .combo-chart { display: flex; align-items: flex-end; gap: 3px; height: 72px; }
  .combo-col {
    position: relative;
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column-reverse;
    border-radius: 2.5px; overflow: visible; background: transparent;
  }
  .combo-col .cv {
    position: absolute; left: 50%; transform: translateX(-50%); top: -13px;
    font-size: 8px; white-space: nowrap; font-variant-numeric: tabular-nums;
    color: var(--kimi-color-text-tertiary); pointer-events: none;
  }
  .combo-col.today .cv { color: var(--c-accent); font-weight: 600; }
  .combo-col .seg { width: 100%; flex: none; }
  .combo-col .seg:first-of-type { border-radius: 0 0 2.5px 2.5px; }
  .combo-col .seg:last-of-type { border-radius: 2.5px 2.5px 0 0; }
  .seg.c0 { background: var(--c-accent); }
  .seg.c1 { background: var(--c-positive); }
  .seg.c2 { background: var(--c-warning); }
  .seg.c3 { background: var(--c-danger); }
  .seg.c4 { background: var(--c-purple); opacity: .8; }
  .combo-x { display: flex; gap: 3px; margin-top: 4px; }
  .combo-x span {
    flex: 1 1 0; min-width: 0; text-align: center; font-size: 8px;
    color: var(--kimi-color-text-quaternary); font-variant-numeric: tabular-nums;
  }
  .combo-x span.today { color: var(--c-accent); font-weight: 600; }
  .combo-legend {
    flex: none; display: flex; flex-direction: column; justify-content: center;
    gap: 6px; margin-top: 0; padding-left: 12px;
    border-left: 1px solid var(--kimi-color-border);
  }
  .combo-legend .lg {
    display: flex; align-items: center; gap: 5px;
    font-size: var(--fs-meta); color: var(--kimi-color-text-tertiary); white-space: nowrap;
  }
  .combo-legend .lg i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .combo-legend .lg b { color: var(--kimi-color-text-secondary); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- 逐小时折线图（agent 行内） ---------- */
  .c0 { --seg: var(--c-accent); }
  .c1 { --seg: var(--c-positive); }
  .c2 { --seg: var(--c-warning); }
  .c3 { --seg: var(--c-danger); }
  .c4 { --seg: var(--c-purple); }
  .ln { width: 100%; height: 44px; display: block; }
  .ln-line {
    fill: none; stroke: var(--seg, var(--c-accent)); stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke;
  }
  .ln-fill { fill: var(--seg, var(--c-accent)); opacity: .12; }
  .ln-now { fill: var(--seg, var(--c-accent)); }

  footer { padding: 12px var(--pad-x) 0; font-size: var(--fs-meta); line-height: 1.6; color: var(--kimi-color-text-quaternary); border-top: 1px solid var(--kimi-color-border); margin-top: 4px; }
  .empty { padding: 28px 4px; font-size: var(--fs-name); color: var(--kimi-color-text-tertiary); }

  /* ---------- 响应式 ---------- */
  @media (min-width: 700px) {
    .p0 output { font-size: 44px; }
    .row-detail { display: flex; }
  }
  @media (max-width: 699px) {
    .meters .meter:nth-child(n+2) { display: none; }
  }
  @media (max-width: 339px) {
    .p0 output { font-size: 28px; }
    .p0 .breakdown { gap: 10px; }
  }
  html[data-daimon-size-tier="compact"] .p0 { padding-bottom: 4px; }
  html[data-daimon-size-tier="compact"] .p0 output { font-size: 24px; }
  html[data-daimon-size-tier="compact"] .p0 .breakdown { display: none; }
</style>
</head>
<body>
<main data-kimi-root class="kimi-host-safe-context">
  <section class="kimi-pixel-stage" data-kimi-pixel-stage>
    <div class="kimi-pixel-background" data-kimi-pixel-background aria-hidden="true"></div>
    <div class="kimi-pixel-content">
      <header class="kimi-host-safe-header" data-kimi-priority="p1">
        <h1>Agent 额度 · 用量</h1>
        <span class="live" data-live>LIVE</span>
        <span class="stamp" data-stamp></span>
      </header>

      <section class="p0" data-kimi-priority="p0" aria-label="今日全机 Token 消耗">
        <p class="eyebrow">今日用量</p>
        <div class="value-row">
          <output data-total>—</output>
          <span class="unit">tokens</span>
          <span class="cost" data-cost hidden></span>
        </div>
        <p class="p0-label">今日全机 Token 消耗 · <span data-agent-count>—</span> 个 agent 在线<span data-lead></span></p>
        <div class="breakdown" data-kimi-priority="p2">
          <span class="bd"><span class="bd-l">输入</span><b data-bd-input>—</b></span>
          <span class="bd"><span class="bd-l">输出</span><b data-bd-output>—</b></span>
          <span class="bd"><span class="bd-l">缓存读取</span><b data-bd-cache>—</b></span>
        </div>
      </section>
    </div>
  </section>

  <h2 class="sec-title" data-kimi-priority="p1">额度 · 还剩多少<span class="hint">云端服务经 CC Switch 查询</span></h2>
  <section class="rows" data-kimi-priority="p1" data-quota aria-label="各服务与 agent 的剩余额度"></section>

  <h2 class="sec-title" data-kimi-priority="p1">用量 · 今日用了多少</h2>
  <section class="combo-wrap" data-kimi-priority="p1" data-combo-wrap hidden aria-label="14 日全机消耗，按 agent 堆叠">
    <div class="combo-main">
      <div class="combo-chart" data-combo></div>
      <div class="combo-x" data-combo-x></div>
    </div>
    <div class="combo-legend" data-combo-legend></div>
  </section>
  <section class="rows" data-kimi-priority="p1" data-agents aria-label="各 agent 今日 token 消耗">
    <p class="empty" data-empty>正在读取本机 agent 用量…</p>
  </section>

  <footer data-kimi-priority="p3" data-note></footer>
</main>

<script>
/* Kimi Pixel Field renderer (inlined, dependency-free) */
(function (global) {
  'use strict';
  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
  function seeded(seed) {
    let state = (Number(seed) || 1) >>> 0;
    return function next() { state = (state * 1664525 + 1013904223) >>> 0; return state / 4294967296; };
  }
  function densityAt(mode, x, y, config) {
    if (mode === 'directional') {
      const angle = (Number(config.flowAngleDeg) || 0) * Math.PI / 180;
      const dx = x - 0.5, dy = y - 0.5;
      const along = dx * Math.cos(angle) + dy * Math.sin(angle);
      const across = -dx * Math.sin(angle) + dy * Math.cos(angle);
      const lane = 1 - Math.abs(across) * 4.4;
      return clamp(lane * 0.72 + (along + 0.7) * 0.2, 0, 1);
    }
    return clamp(0.12 + x * 0.88, 0, 1);
  }
  function mount(container, options) {

    function rebuild() {

      const ratio = Math.min(global.devicePixelRatio || 1, 2);

      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      const gap = Math.max(8, Number(config.spacing) || 14) * (compact ? 1.7 : 1);
      const variance = clamp(Number.isFinite(Number(config.variance)) ? Number(config.variance) : 0.34, 0, 0.9);
      const random = seeded(config.seed);
      const next = [];
      for (let y = gap / 2; y < size.height; y += gap) {
        for (let x = gap / 2; x < size.width; x += gap) {

          if (random() > density * (compact ? 0.46 : 0.84)) continue;

      if (destroyed || !visible) return;

      const flowAngle = (Number(config.flowAngleDeg) || 0) * Math.PI / 180;
      const drift = reduced ? 0 : ((Number(timestamp) || 0) / 1000) * (Number(config.driftSpeed) || 0);
      for (const mark of marks) {
        let x = mark.x + Math.cos(flowAngle) * drift;
        let y = mark.y + Math.sin(flowAngle) * drift;

        y = ((y % size.height) + size.height) % size.height;

</script>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var reducedMotion = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function fmt(n) {
    n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, "") + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return String(Math.round(n));
  }
  function fmtUsd(n) {
    if (n === null || n === undefined || isNaN(n)) return "";
    return "$" + (n >= 100 ? n.toFixed(0) : n >= 1 ? n.toFixed(2) : n.toFixed(3));
  }
  function fmtTime(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var p = function (x) { return String(x).padStart(2, "0"); };
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function fmtReset(epochSec) {
    if (!epochSec) return "";
    var d = new Date(Number(epochSec) * 1000);
    var p = function (x) { return String(x).padStart(2, "0"); };
    return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function pctClass(p) { return p >= 85 ? "danger" : p >= 60 ? "warn" : ""; }

  /* ---------- 量条（额度区唯一组件） ---------- */
  function meter(label, pct, sub, ownRow) {
    var p = Math.max(0, Math.min(100, pct));
    return '<div class="meter' + (ownRow ? " full" : "") + '">' +
      '<div class="m-top"><span class="m-label">' + esc(label) + '</span>' +
      '<span class="m-val">剩 ' + Math.max(0, 100 - p).toFixed(0) + '%</span></div>' +
      '<div class="m-track" role="img" aria-label="' + esc(label) + '已用 ' + p.toFixed(0) + '%">' +
      '<div class="m-fill ' + pctClass(p) + '" style="width:' + p + '%"></div></div>' +
      (sub ? '<div class="m-sub">' + esc(sub) + "</div>" : "") +
      "</div>";
  }
  function metersFor(windows) {
    if (!windows || !windows.length) return "";
    return '<div class="meters">' + windows.map(function (w) {
      var parts = [];
      if (w.used != null && w.limit != null) parts.push("已用 " + w.used + " / " + w.limit);
      var reset = fmtReset(w.resetsAt);
      if (reset) parts.push((w.label === "赠送额度" ? reset + " 到期" : reset + " 重置"));
      return meter(w.label, w.usedPercent, parts.join(" · "), w.ownRow);
    }).join("") + "</div>";
  }

  /* ---------- P0 数字滚动 ---------- */
  var counted = 0;
  function countUp(el, target) {
    if (!el) return;
    if (reducedMotion || typeof requestAnimationFrame !== "function" || !target) {
      el.textContent = fmt(target); counted = target; return;
    }
    var from = counted, start = null, dur = 700;
    function step(ts) {
      if (start === null) start = ts;
      var k = Math.min(1, (ts - start) / dur);
      el.textContent = fmt(from + (target - from) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step); else counted = target;
    }
    requestAnimationFrame(step);
  }

  /* ---------- pixel 流场 ---------- */
  var field = null;
  function updateField(total, cacheRatio) {
    var bg = $("[data-kimi-pixel-background]");
    if (!bg || !window.KimiPixelField) return;
    var tier = (document.documentElement.getAttribute("data-daimon-size-tier") || "regular");
    if (field) { field.destroy(); field = null; }
    var lvl = total > 0 ? Math.min(1, Math.max(0, (Math.log10(total) - 3) / 6)) : 0;
    try {
      field = window.KimiPixelField.mount(bg, {
        mode: "directional", mark: "ascii", characters: "·:+*#",
        flowAngleDeg: 0,
        spacing: 17 - lvl * 7,
        driftSpeed: lvl * 16,
        variance: 0.2 + Math.min(0.6, cacheRatio * 0.7),
        opacity: 0.5, pointer: true,
        pointerTarget: $("[data-kimi-pixel-stage]") || bg,
        tier: tier === "compact" ? "compact" : "regular", seed: 11
      });
    } catch (e) { field = null; }
  }

  /* ============================================================
     额度区: 云端服务 + 有额度快照的 agent, 统一成行
     ============================================================ */
  function quotaRow(entry, sub) {
    var badge = entry.isCurrent ? '<span class="badge">当前</span>' : "";
    var plan = entry.plan ? '<span class="badge plain">' + esc(entry.plan) + "</span>" : "";
    var right, meters = "";
    if (entry.kind === "balance") {
      right = '<span class="value">' + (entry.currency === "CNY" ? "¥" : "") + Number(entry.balance).toFixed(2) +
        "<small>余额 " + esc(entry.currency || "") + "</small></span>";
    } else if (entry.windows && entry.windows.length) {
      var top = Math.max.apply(null, entry.windows.map(function (w) { return w.usedPercent; }));
      right = '<span class="value">' + Math.max(0, 100 - top).toFixed(0) + "%<small>剩余</small></span>";
      meters = metersFor(entry.windows);
    } else {
      right = '<span class="value">' + esc(entry.rightText || "—") + "</span>";
    }
    var name = sub ? entry.name.replace(/^Codex · /, "") : entry.name;
    return '<div class="row' + (sub ? " sub" : "") + (entry.dim ? " dim" : "") + '">' +
      '<div class="row-head"><span class="dot ' + entry.dot + '" aria-hidden="true"></span>' +
      '<span class="name">' + esc(name) + badge + plan + "</span>" + right + "</div>" +
      meters +
      (entry.extra ? '<div class="row-extra">' + esc(entry.extra) + "</div>" : "") +
      "</div>";
  }
  /* 多账号组（如 Codex）：一行总消耗 + 缩进的分账号子行 */
  function groupBlock(members) {
    var oks = members.filter(function (m) { return !m.dim && m.windows && m.windows.length; });
    var avg = oks.length
      ? oks.reduce(function (s, m) {
          return s + Math.max.apply(null, m.windows.map(function (w) { return w.usedPercent; }));
        }, 0) / oks.length
      : 0;
    var rank = { danger: 3, warn: 2, ok: 1, dim: 0 };
    var worst = members.reduce(function (w, m) {
      return (rank[m.dot] || 0) > (rank[w] || 0) ? m.dot : w;
    }, "dim");
    return '<div class="row grp-head">' +
      '<div class="row-head"><span class="dot ' + worst + '" aria-hidden="true"></span>' +
      '<span class="name">Codex<span class="badge plain">' + members.length + ' 个账号</span></span>' +
      '<span class="value">' + Math.max(0, 100 - avg).toFixed(0) + "%<small>合计剩余</small></span></div>" +
      meter("合计消耗", avg, oks.length + " 个账号平均已用") +
      "</div>" +
      '<div class="grp-body">' +
      members.map(function (m) { return quotaRow(m, true); }).join("") +
      "</div>";
  }
  function renderQuota(services, agents) {
    var box = $("[data-quota]");
    if (!box) return;
    var entries = [];
    (services || []).forEach(function (s) {
      var wins = s.windows || [];
      var top = wins.length ? Math.max.apply(null, wins.map(function (w) { return w.usedPercent; })) : null;
      entries.push({
        name: s.name, plan: s.plan, isCurrent: s.isCurrent,
        kind: s.kind, balance: s.balance, currency: s.currency, windows: wins,
        extra: s.extra || null,
        grp: s.app === "codex" ? "codex" : null,
        dim: s.status !== "ok",
        dot: s.status !== "ok" ? "dim" : (top === null ? "ok" : (top >= 85 ? "danger" : top >= 60 ? "warn" : "ok")),
        rightText: s.status === "error" ? "查询失败" : "无数据",
        sortKey: top === null ? -1 : top
      });
    });
    (agents || []).forEach(function (a) {
      if (a.status !== "ok" || !a.quota || !a.quota.windows || !a.quota.windows.length) return;
      var top = Math.max.apply(null, a.quota.windows.map(function (w) { return w.usedPercent; }));
      entries.push({
        name: a.name, plan: a.quota.plan, isCurrent: false,
        kind: "windows", windows: a.quota.windows,
        dim: false,
        dot: top >= 85 ? "danger" : top >= 60 ? "warn" : "ok",
        sortKey: top
      });
    });
    /* 同组服务（如多个 Codex 账号）相邻显示；组按最紧张的成员排序，组内当前账号在前 */
    var gmax = {};
    entries.forEach(function (e) {
      var g = e.grp || e.name;
      if (!(g in gmax) || e.sortKey > gmax[g]) gmax[g] = e.sortKey;
    });
    entries.sort(function (a, b) {
      var ga = a.grp || a.name, gb = b.grp || b.name;
      if (gmax[ga] !== gmax[gb]) return gmax[gb] - gmax[ga];
      if (ga !== gb) return ga < gb ? -1 : 1;
      if (!!a.isCurrent !== !!b.isCurrent) return a.isCurrent ? -1 : 1;
      return b.sortKey - a.sortKey;
    });
    var html = "", i = 0;
    while (i < entries.length) {
      if (entries[i].grp === "codex") {
        var members = [];
        while (i < entries.length && entries[i].grp === "codex") { members.push(entries[i]); i++; }
        html += members.length > 1 ? groupBlock(members) : quotaRow(members[0]);
      } else {
        html += quotaRow(entries[i]);
        i++;
      }
    }
    box.innerHTML = html || '<p class="empty">暂无可查询的额度</p>';
  }

  /* ============================================================
     用量区: 组合堆叠图 + 各行数字明细
     ============================================================ */
  /* 14 日全机消耗，按 agent 堆叠成一张图（取前 4 名，其余按名称合并展示） */
  var colorByName = {};
  function renderCombo(agents) {
    var wrap = $("[data-combo-wrap]");
    if (!wrap) return;
    var chart = $("[data-combo]"), xAxis = $("[data-combo-x]"), legend = $("[data-combo-legend]");
    var ok = (agents || []).filter(function (a) { return a.status === "ok" && a.daily && a.daily.length; });
    var sums = ok.map(function (a) {
      var s = 0;
      a.daily.forEach(function (d) { s += d.total || 0; });
      return { a: a, sum: s };
    }).filter(function (x) { return x.sum > 0; });
    sums.sort(function (x, y) { return y.sum - x.sum; });
    if (!sums.length) { wrap.hidden = true; return; }
    var n = sums[0].a.daily.length;
    var series = sums.slice(0, 4).map(function (x, i) {
      return { name: x.a.name, sum: x.sum, daily: x.a.daily, cls: "c" + i };
    });
    if (sums.length > 4) {
      var rest = sums.slice(4), restSum = 0, restDaily = [];
      for (var i = 0; i < n; i++) restDaily.push(0);
      rest.forEach(function (x) {
        restSum += x.sum;
        x.a.daily.forEach(function (d, i) { restDaily[i] += d.total || 0; });
      });
      series.push({ name: rest.map(function (x) { return x.a.name; }).join("、"), sum: restSum, daily: null, values: restDaily, cls: "c4" });
    }
    colorByName = {};
    sums.forEach(function (x, i) { colorByName[x.a.name] = "c" + Math.min(i, 4); });
    var dayTotals = [];
    var grand = 0;
    for (var d = 0; d < n; d++) {
      var t = 0;
      series.forEach(function (s) { t += s.daily ? (s.daily[d].total || 0) : s.values[d]; });
      dayTotals.push(t); grand += t;
    }
    var maxDay = Math.max.apply(null, dayTotals);
    if (maxDay <= 0) { wrap.hidden = true; return; }
    var dates = sums[0].a.daily.map(function (x) { return x.date; });
    chart.innerHTML = dayTotals.map(function (t, i) {
      var h = Math.max(t > 0 ? 4 : 1, Math.round((t / maxDay) * 100));
      var segs = series.map(function (s) {
        var v = s.daily ? (s.daily[i].total || 0) : s.values[i];
        if (!v || !t) return "";
        var share = (v / t) * 100;
        return '<div class="seg ' + s.cls + '" style="height:' + share.toFixed(2) + '%" title="' +
          esc(dates[i]) + " · " + esc(s.name) + " · " + fmt(v) + '"></div>';
      }).join("");
      var val = t > 0 ? '<span class="cv">' + fmt(t) + "</span>" : "";
      var top = "", topV = -1;
      series.forEach(function (s) {
        var v = s.daily ? (s.daily[i].total || 0) : s.values[i];
        if (v > topV) { topV = v; top = s.name; }
      });
      return '<div class="combo-col' + (i === n - 1 ? " today" : "") + '" data-top="' + esc(top) + '" style="height:' + h + '%" title="' +
        esc(dates[i]) + " · 合计 " + fmt(t) + '">' + val + segs + "</div>";
    }).join("");
    xAxis.innerHTML = dates.map(function (dt, i) {
      var label = i === n - 1 ? "今天" : dt.slice(5).replace("-", "/");
      var show = i === n - 1 || i === 0 || i === Math.floor(n / 2) || n <= 7;
      return "<span" + (i === n - 1 ? ' class="today"' : "") + ">" + (show ? label : "") + "</span>";
    }).join("");
    legend.innerHTML = series.map(function (s) {
      var pct = grand > 0 ? Math.round((s.sum / grand) * 100) : 0;
      return '<span class="lg ' + s.cls + '" data-lg="' + esc(s.name) + '"><i class="seg ' + s.cls + '"></i>' + esc(s.name) + " <b>" + fmt(s.sum) + "</b> · " + pct + "%</span>";
    }).join("");
    wrap.hidden = false;
  }

  /* 逐小时折线图（SVG，颜色与堆叠图图例一致） */
  function lineChart(hours, cls) {
    var W = 240, H = 40, padT = 4, padB = 4;
    var max = Math.max.apply(null, hours);
    if (!max || max <= 0) return "";
    var nowH = new Date().getHours();
    var px = function (i) { return (i / 23) * W; };
    var py = function (v) { return H - padB - (v / max) * (H - padT - padB); };
    var pts = hours.map(function (v, i) { return px(i).toFixed(1) + "," + py(v).toFixed(1); });
    var area = "0," + H + " " + pts.join(" ") + " " + W + "," + H;
    var hovers = hours.map(function (v, i) {
      return '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(v).toFixed(1) + '" r="5" fill="transparent">' +
        "<title>" + i + "时 · " + fmt(v) + "</title></circle>";
    }).join("");
    return '<svg class="ln" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img" aria-label="今日逐小时用量">' +
      '<polygon class="ln-fill ' + cls + '" points="' + area + '"></polygon>' +
      '<polyline class="ln-line ' + cls + '" points="' + pts.join(" ") + '"></polyline>' +
      '<circle class="ln-now ' + cls + '" cx="' + px(nowH).toFixed(1) + '" cy="' + py(hours[nowH]).toFixed(1) + '" r="2.4"></circle>' +
      hovers + "</svg>";
  }

  function detailView(a) {
    var strips = "";
    if (a.hours && a.hours.length === 24 && a.hours.some(function (h) { return h > 0; })) {
      strips += '<div class="strip"><div class="s-label">今日逐小时</div>' + lineChart(a.hours, colorByName[a.name] || "c4") + "</div>";
    }
    var chips = "";
    (a.todayModels || []).slice(0, 3).forEach(function (m) {
      chips += '<span class="chip">' + esc(m.model) + " · <b>" + fmt(m.total) + "</b>" +
        (m.costUsd != null ? " · " + fmtUsd(m.costUsd) : "") + "</span>";
    });
    (a.projects || []).slice(0, 2).forEach(function (p) {
      if (p.total > 0) chips += '<span class="chip proj">' + esc(p.name) + " · <b>" + fmt(p.total) + "</b></span>";
    });
    if (!strips && !chips) return "";
    return '<div class="row-detail" data-kimi-priority="p2">' +
      (strips ? '<div class="strips">' + strips + "</div>" : "") +
      (chips ? '<div class="chips">' + chips + "</div>" : "") +
      "</div>";
  }

  function usageRow(a, idx) {
    var dim = a.status !== "ok";
    var right;
    if (dim) {
      right = '<span class="value">' + (a.status === "unsupported" ? "未接入" : "未安装") + "<small>" + esc(a.note || "") + "</small></span>";
    } else {
      var cost = a.todayCostUsd != null ? " · " + fmtUsd(a.todayCostUsd) : "";
      right = '<span class="value">' + fmt(a.today.total) + "<small>今日" + cost + "</small></span>";
    }
    return '<div class="row' + (dim ? " dim" : "") + (idx === 0 && !dim ? " lead" : "") + '">' +
      '<div class="row-head"><span class="dot ' + (dim ? "dim" : "ok") + '" aria-hidden="true"></span>' +
      '<span class="name">' + (dim ? "" : '<span class="rank">#' + (idx + 1) + "</span>") + esc(a.name) + "</span>" +
      right + "</div>" +
      (dim ? "" : detailView(a)) +
      "</div>";
  }

  function render(data) {
    var main = data && data.main;
    if (!main || !main.agents) {
      var t = $("[data-total]");
      if (t) t.textContent = "—";
      return;
    }
    var agents = main.agents.slice().sort(function (a, b) {
      var ra = a.status === "ok" ? 0 : 1, rb = b.status === "ok" ? 0 : 1;
      if (ra !== rb) return ra - rb;
      return (b.today.total || 0) - (a.today.total || 0);
    });
    var total = 0, inp = 0, out = 0, cache = 0, online = 0, lead = null;
    agents.forEach(function (a) {
      if (a.status !== "ok") return;
      online++;
      total += a.today.total || 0;
      inp += (a.today.input || 0) + (a.today.cacheRead || 0) + (a.today.cacheCreation || 0);
      out += a.today.output || 0;
      cache += a.today.cacheRead || 0;
      if (!lead && a.today.total > 0) lead = a;
    });
    countUp($("[data-total]"), total);
    var el;
    if ((el = $("[data-agent-count]"))) el.textContent = online;
    if ((el = $("[data-bd-input]"))) el.textContent = fmt(inp);
    if ((el = $("[data-bd-output]"))) el.textContent = fmt(out);
    if ((el = $("[data-bd-cache]"))) el.textContent = fmt(cache);
    if ((el = $("[data-stamp]"))) el.textContent = "更新 " + fmtTime(main.generatedAt);
    if ((el = $("[data-lead]"))) el.innerHTML = lead ? ' · 最活跃 <b>' + esc(lead.name) + "</b>" : "";
    var costEl = $("[data-cost]");
    if (costEl) {
      if (main.totalCostUsd != null) { costEl.hidden = false; costEl.textContent = "≈ " + fmtUsd(main.totalCostUsd); }
      else costEl.hidden = true;
    }
    renderQuota(main.services, agents);
    renderCombo(agents);
    var listEl = $("[data-agents]");
    if (listEl) {
      var empty = $("[data-empty]");
      if (empty) empty.remove();
      listEl.innerHTML = agents.map(usageRow).join("");
    }
    if ((el = $("[data-note]"))) el.textContent = "用量来自各 agent 本地会话记录 · 云端额度经 CC Switch 配置查询 · 成本按 CC Switch 定价表估算 · 每 30 分钟自动刷新";
    updateField(total, total > 0 ? cache / total : 0);
  }

  function renderStatus(status) {
    var live = $("[data-live]");
    if (!live) return;
    live.textContent = status === "running" ? "刷新中" : "LIVE";
  }

  var host = window.DaimonWidget;
  if (host && typeof host.onDataChange === "function") host.onDataChange(render);
  if (host && typeof host.onStatusChange === "function") {
    host.onStatusChange(function () { renderStatus(window.DaimonWidget.status); });
  }
  if (host && typeof host.onThemeChange === "function") {
    host.onThemeChange(function () { if (field) field.render(); });
  }
})();
</script>
</body>
</html>
