[package]
name = "bruce-win"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "bruce_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
bruce-win-viewmodel = { path = "../viewmodel" }
collector-domain = { path = "../../../core/collector/crates/collector-domain" }
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
