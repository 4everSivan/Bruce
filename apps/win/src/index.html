<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruce</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-fluent">
  <main id="panel">
    <!-- HUD 头: 呼吸灯 + 品牌 + 系统态 (mac dashboardTopHeader) -->
    <header id="hud">
      <div class="hud-left">
        <span id="hud-dot-wrap" class="hud-dot-wrap"><span class="hud-dot"></span></span>
        <span class="hud-brand">Bruce // HUD</span>
      </div>
      <span id="runtime-status" class="hud-sysok" role="status">等待刷新</span>
      <span id="hud-agents" class="hud-right">STANDBY</span>
    </header>

    <nav id="tabs">
      <button data-view="dashboard" class="tab active">看板</button>
      <button data-view="credentials" class="tab">凭证</button>
      <button data-view="settings" class="tab">设置</button>
    </nav>

    <div id="scroll">
      <!-- 看板视图: 卡片栈由 app.js 按 viewmodel 契约渲染 -->
      <section id="view-dashboard">
        <div id="dashboard-status" class="dashboard-status" role="status"></div>
        <div id="dashboard-diagnostics" class="dashboard-status"></div>
        <div id="stack" class="card-stack"></div>
      </section>

      <section id="view-credentials" class="hidden"><div id="credentials-content" class="configuration-content"></div></section>
      <section id="view-settings" class="hidden"><div id="settings-content" class="configuration-content"></div></section>
    </div>

    <!-- 底栏动作 (mac actionFooter: 刷新/设置/退出) -->
    <footer id="footer">
      <div class="foot-inner">
        <button id="refresh" class="foot-btn" title="立即刷新">⟳</button>
        <span class="foot-spacer"></span>
        <button id="foot-settings" class="foot-btn" title="设置">⚙</button>
        <button id="foot-quit" class="foot-btn" title="退出 Bruce">⏻</button>
      </div>
    </footer>
  </main>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
