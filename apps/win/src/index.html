<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruce</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-fluent">
  <main id="panel">
    <!-- HUD 头: 呼吸灯 + 品牌 + 系统态 (mac dashboardTopHeader) -->
    <header id="hud">
      <div class="hud-left">
        <span id="hud-dot-wrap" class="hud-dot-wrap"><span class="hud-dot"></span></span>
        <span class="hud-brand">Bruce // HUD</span>
      </div>
      <span class="hud-sysok">SYS.OK</span>
      <span id="hud-agents" class="hud-right">STANDBY</span>
    </header>

    <nav id="tabs">
      <button data-view="dashboard" class="tab active">看板</button>
      <button data-view="credentials" class="tab">凭证</button>
      <button data-view="settings" class="tab">设置</button>
    </nav>

    <div id="scroll">
      <!-- 看板视图: 卡片栈由 app.js 按 viewmodel 契约渲染 -->
      <section id="view-dashboard">
        <div id="stack" class="card-stack"></div>
      </section>

      <!-- 凭证视图 (Onboarding 引导) -->
      <section id="view-credentials" class="hidden">
        <section class="card">
          <h2>订阅凭证引导</h2>
          <p class="placeholder">
            按需粘贴 provider 凭证 JSON (结构对齐采集端契约); 仅白名单字段可保存,
            文件落盘 <code>%APPDATA%\Bruce\credentials.json</code> (仅当前用户可读)。
            保存后立即触发一次采集。
          </p>
          <div id="credential-fields"></div>
          <div class="actions">
            <button id="credentials-save">保存凭证</button>
            <span id="credentials-status"></span>
          </div>
        </section>
      </section>

      <!-- 设置视图 -->
      <section id="view-settings" class="hidden">
        <section class="card">
          <h2>通用设置</h2>
          <label class="row">
            <span>刷新间隔 (分钟)</span>
            <input id="setting-interval" type="number" min="1" max="1440" />
          </label>
          <label class="row">
            <span>配额预警通知</span>
            <input id="setting-notifications" type="checkbox" />
          </label>
          <label class="row">
            <span>主题</span>
            <select id="setting-theme">
              <option value="fluent">Fluent</option>
              <option value="nothing">Nothing 点阵</option>
            </select>
          </label>
          <label class="row">
            <span>全局热键</span>
            <input id="setting-hotkey" type="text" placeholder="CommandOrControl+Shift+B" />
          </label>
          <div class="actions">
            <button id="settings-save">保存设置</button>
            <span id="settings-status"></span>
          </div>
        </section>
      </section>
    </div>

    <!-- 底栏动作 (mac actionFooter: 刷新/设置/退出) -->
    <footer id="footer">
      <div class="foot-inner">
        <button id="refresh" class="foot-btn" title="立即刷新">⟳</button>
        <span class="foot-spacer"></span>
        <button id="foot-settings" class="foot-btn" title="设置">⚙</button>
        <button id="foot-quit" class="foot-btn" title="退出 Bruce">⏻</button>
      </div>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
