<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruce 实时预览</title>
  <style>
    :root {
      --bg-acrylic: rgba(24, 28, 38, 0.92);
      --border-acrylic: rgba(255, 255, 255, 0.12);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.06);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --text-dim: #6b7280;
      --accent: #3b82f6;
      --ok: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --track-bg: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 420px;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .micro-preview-card {
      width: 420px;
      border-radius: 12px;
      background: var(--bg-acrylic);
      backdrop-filter: blur(36px) saturate(180%);
      -webkit-backdrop-filter: blur(36px) saturate(180%);
      border: 1px solid var(--border-acrylic);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: flyoutSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes flyoutSlideIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 顶栏 */
    .card-topbar {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .brand-status-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .status-badge-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--ok);
    }
    .status-badge-chip.warn {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warn);
    }
    .status-badge-chip.danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }
    .status-badge-chip.neutral {
      background: rgba(156, 163, 175, 0.15);
      color: var(--text-sub);
    }
    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }
    .card-top-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .icon-btn {
      border: none;
      background: transparent;
      color: inherit;
      opacity: 0.65;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.1);
    }

    /* 核心指标行 (左环形 + 右数值) */
    .hero-metric-row {
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .metric-box {
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ring-container {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }
    .ring-svg {
      width: 42px;
      height: 42px;
      transform: rotate(-90deg);
    }
    .ring-circle-bg {
      fill: none;
      stroke: var(--track-bg);
      stroke-width: 3.5;
    }
    .ring-circle-val {
      fill: none;
      stroke: var(--ok);
      stroke-width: 3.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease, stroke 0.3s ease;
    }
    .ring-center-txt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-main);
    }
    .metric-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .metric-title {
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .metric-sub {
      font-size: 10.5px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-stat-box {
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }
    .kpi-stat-val {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .kpi-stat-sub {
      font-size: 10px;
      color: var(--text-dim);
    }

    /* 订阅额度极简条 */
    .quota-compact-strip {
      padding: 4px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .quota-strip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
    }
    .quota-strip-title {
      color: var(--text-sub);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .quota-strip-val {
      color: var(--text-main);
      font-weight: 600;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--track-bg);
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--ok);
      transition: width 0.3s ease;
    }

    /* 底部动作栏 */
    .card-footer-actions {
      padding: 8px 14px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.15);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .footer-btn {
      flex: 1;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .footer-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.16);
    }
    .footer-btn.primary {
      background: #2563eb;
      border-color: #3b82f6;
    }
    .footer-btn.primary:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="micro-preview-card" id="previewCard">
    <!-- 顶栏状态与控制 -->
    <div class="card-topbar">
      <div class="brand-status-meta">
        <span class="brand-name">Bruce</span>
        <div class="status-badge-chip" id="statusChip">
          <span class="status-dot"></span>
          <span id="statusText">运行正常</span>
        </div>
      </div>
      <div class="card-top-actions">
        <button class="icon-btn" id="refreshBtn" title="立即刷新">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
        </button>
        <button class="icon-btn" id="closeBtn" title="收起预览">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <!-- 核心指标行: 42px 标准环形配额仪表 + 今日统计 -->
    <div class="hero-metric-row">
      <!-- 42px 环形仪表 -->
      <div class="metric-box" id="quotaMetricBox">
        <div class="ring-container">
          <svg class="ring-svg" viewBox="0 0 42 42">
            <circle class="ring-circle-bg" cx="21" cy="21" r="16" />
            <circle class="ring-circle-val" id="ringCircle" cx="21" cy="21" r="16" stroke-dasharray="100.53" stroke-dashoffset="15.0" />
          </svg>
          <span class="ring-center-txt" id="ringPercentText">—</span>
        </div>
        <div class="metric-info">
          <span class="metric-title" id="topProviderName">—</span>
          <span class="metric-sub" id="topResetCountdown">—</span>
        </div>
      </div>

      <!-- 今日统计 -->
      <div class="kpi-stat-box">
        <div class="metric-title">今日模型用量</div>
        <div class="kpi-stat-val" id="kpiCostText">—</div>
        <div class="kpi-stat-sub" id="kpiTokensText">—</div>
      </div>
    </div>

    <!-- 活跃 Agent 与补充额度极简条 -->
    <div class="quota-compact-strip" id="activeAgentStrip">
      <div class="quota-strip-header">
        <span class="quota-strip-title" id="agentStripTitle">
          <span style="width:6px; height:6px; border-radius:50%; background:var(--ok);"></span>
          活跃 Agent 状态
        </span>
        <span class="quota-strip-val" id="activeAgentCountText">0 运行中</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="stripProgressFill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- 底部快捷动作栏 -->
    <div class="card-footer-actions">
      <button class="footer-btn primary" id="expandBtn" title="展开置顶完整仪表盘">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        展开看板 (Ctrl+Shift+B)
      </button>
      <button class="footer-btn" id="settingsBtn" title="打开设置中心">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        设置
      </button>
    </div>
  </div>

  <script>
    const tauri = window.__TAURI__;
    let leaveTimer = null;

    function invokeTauri(cmd, args) {
      if (tauri && tauri.core && tauri.core.invoke) {
        return tauri.core.invoke(cmd, args);
      }
      return Promise.resolve(null);
    }

    // 渲染视图模型 (C115): 全部取自后端 `panel.preview` —— 与托盘配额环同一份
    // extract_quota_summary 结果, 状态灯与 HUD / 托盘同一判定表 (C100); 缺失值显示「—」。
    const TONE_TEXT = { ok: "运行正常", warn: "部分告警", error: "异常断开", neutral: "暂无数据" };
    function renderPreview(panel) {
      const preview = panel && panel.preview;
      if (!preview) return;

      // 1. 状态灯
      const statusChip = document.getElementById("statusChip");
      statusChip.className = "status-badge-chip";
      if (preview.statusTone === "warn") statusChip.classList.add("warn");
      if (preview.statusTone === "error") statusChip.classList.add("danger");
      statusChip.title = preview.statusReason || "";
      document.getElementById("statusText").textContent =
        TONE_TEXT[preview.statusTone] || preview.statusReason || "—";

      // 2. 今日费用与 Token
      document.getElementById("kpiCostText").textContent = preview.costText || "—";
      document.getElementById("kpiTokensText").textContent =
        preview.tokensText ? preview.tokensText + " Tokens" : "—";

      // 3. 活跃 Agent (与 HUD「N AGENTS ACTIVE」同口径)
      document.getElementById("activeAgentCountText").textContent = preview.activeAgents + " 活跃";

      // 4. 配额与 42px 环形仪表: 无有效配额窗口时不伪装为 100%
      const hasQuota = typeof preview.remainingPct === "number";
      const remainingPct = hasQuota ? Math.max(0, Math.min(100, Math.round(preview.remainingPct))) : 0;
      document.getElementById("ringPercentText").textContent = hasQuota ? remainingPct + "%" : "—";
      document.getElementById("topProviderName").textContent = preview.topProvider || "暂无订阅额度";
      document.getElementById("topResetCountdown").textContent =
        preview.resetText ? "重置 " + preview.resetText : (preview.topWindowLabel || "—");

      // SVG 周长 2 * PI * 16 = 100.53
      const circumference = 100.53;
      const offset = circumference - (remainingPct / 100) * circumference;
      const ringCircle = document.getElementById("ringCircle");
      ringCircle.style.strokeDashoffset = offset;
      if (!hasQuota) {
        ringCircle.style.stroke = "var(--muted, #8a8a8a)";
      } else if (remainingPct < 15) {
        ringCircle.style.stroke = "var(--danger)";
      } else if (remainingPct < 30) {
        ringCircle.style.stroke = "var(--warn)";
      } else {
        ringCircle.style.stroke = "var(--ok)";
      }

      const stripFill = document.getElementById("stripProgressFill");
      stripFill.style.width = remainingPct + "%";
      stripFill.style.background = ringCircle.style.stroke;
    }

    // 交互绑定
    document.getElementById("expandBtn").addEventListener("click", () => {
      invokeTauri("expand_dashboard");
    });
    document.getElementById("settingsBtn").addEventListener("click", () => {
      invokeTauri("open_settings");
      invokeTauri("hide_preview_window");
    });
    document.getElementById("refreshBtn").addEventListener("click", () => {
      invokeTauri("refresh_now");
    });
    document.getElementById("closeBtn").addEventListener("click", () => {
      invokeTauri("hide_preview_window");
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        invokeTauri("hide_preview_window");
      }
    });

    // 鼠标移出预览卡平滑自动收起
    const cardEl = document.getElementById("previewCard");
    cardEl.addEventListener("mouseleave", () => {
      leaveTimer = setTimeout(() => {
        invokeTauri("hide_preview_window");
      }, 350);
    });
    cardEl.addEventListener("mouseenter", () => {
      if (leaveTimer) {
        clearTimeout(leaveTimer);
        leaveTimer = null;
      }
    });

    // 启动与事件监听
    invokeTauri("get_dashboard").then(panel => {
      if (panel) renderPreview(panel);
    });

    if (tauri && tauri.event) {
      tauri.event.listen("dashboard-updated", (event) => {
        renderPreview(event.payload);
      });
    }
  </script>
</body>
</html>
