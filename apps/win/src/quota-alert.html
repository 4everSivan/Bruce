<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruce 额度预警</title>
  <style>
    :root {
      --bg-acrylic: rgba(24, 28, 38, 0.94);
      --border-acrylic: rgba(255, 255, 255, 0.12);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --track-bg: rgba(255, 255, 255, 0.10);
      --tier-notice: #EAB308;
      --tier-warn: #F59E0B;
      --tier-danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 280px;
      margin: 0 auto;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .quota-card {
      width: 280px;
      border-radius: 10px;
      background: var(--bg-acrylic);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--border-acrylic);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      gap: 6px;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .alert-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .badge-icon {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      overflow: hidden;
    }

    .badge-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .info-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .info-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .service-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .right-time-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .window-chip {
      font-size: 8.5px;
      font-weight: 500;
      color: var(--text-sub);
      padding: 1px 4.5px;
      border-radius: 3.5px;
      background: rgba(128, 128, 128, 0.12);
      border: 0.5px solid rgba(128, 128, 128, 0.2);
      white-space: nowrap;
      line-height: 1.2;
    }

    body.theme-nothing .window-chip {
      font-family: "Space Mono", monospace;
      border-radius: 3px;
      border: 1px solid #333333;
      background: #181818;
      color: #999999;
    }

    .info-bottom {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      margin-top: 2px;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--track-bg);
      overflow: hidden;
      position: relative;
    }

    .percent-val {
      font-size: 11px;
      font-weight: 700;
      font-family: system-ui, -apple-system, sans-serif;
      white-space: nowrap;
      flex-shrink: 0;
    }
      position: relative;
    }

    .progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .countdown-timer {
      font-size: 9px;
      font-weight: 600;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    .close-btn {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 9px;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: var(--text-main);
    }

    /* Nothing 极客硬核点阵风格适配 */
    body.theme-nothing {
      --bg-acrylic: #000000;
      --border-acrylic: #303030;
      --text-main: #FFFFFF;
      --text-sub: #999999;
      --track-bg: #222222;
      --tier-notice: #4A9E5C;
      --tier-warn: #D4A843;
      --tier-danger: #D71921;
    }
    body.theme-nothing .quota-card {
      border-radius: 8px;
      background: #000000;
      border: 1px solid #303030;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    body.theme-nothing .service-title {
      font-family: "Space Grotesk", sans-serif;
      color: #FFFFFF;
    }
    body.theme-nothing .window-label {
      font-family: "Space Mono", monospace;
      color: #999999;
    }
    body.theme-nothing .percent-val {
      font-family: "Space Mono", monospace;
    }
    body.theme-nothing .countdown-timer {
      font-family: "Space Mono", monospace;
      font-weight: 700;
    }
    body.theme-nothing .close-btn {
      border-radius: 2px;
      background: transparent;
      color: #999999;
      font-family: "Space Mono", monospace;
    }
    body.theme-nothing .close-btn:hover {
      background: #222222;
      color: #D71921;
    }
    body.theme-nothing .progress-track.segmented {
      display: flex;
      gap: 1.5px;
      background: transparent;
      height: 4px;
    }
    body.theme-nothing .nothing-seg {
      flex: 1;
      height: 100%;
      background: #222222;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="quota-card" id="quotaCard">
    <div id="alertsContainer"></div>
  </div>

  <script src="provider-brand.js"></script>
  <script src="quota-alert.js"></script>
</body>
</html>
