<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruce 设置</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="settings-window theme-fluent">
  <div id="settings-app" class="settings-layout">
    <!-- Fluent 侧边栏: WinUI NavigationView 1:1 对齐 mac SettingsView -->
    <nav id="settings-nav" class="sidenav" aria-label="设置导航">
      <div class="nav-list">
        <button type="button" class="navitem active" data-category="general">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          <span class="nav-text">通用</span>
        </button>
        <button type="button" class="navitem" data-category="agentUsage">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
          <span class="nav-text">Agent 用量</span>
        </button>
        <button type="button" class="navitem" data-category="modelPricing">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
          <span class="nav-text">模型计费</span>
        </button>
        <button type="button" class="navitem" data-category="subscription">
          <svg class="ic" viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
          <span class="nav-text">订阅额度</span>
        </button>
        <button type="button" class="navitem" data-category="consent">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
          <span class="nav-text">授权与隐私</span>
        </button>
        <button type="button" class="navitem" data-category="maintenance">
          <svg class="ic" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76Z"/></svg>
          <span class="nav-text">维护</span>
          <!-- T11 方案 B: 有可用更新且未处理时的静默角标 (title/aria 与共享 fixture rows.navigationBadge 一致) -->
          <span class="nav-dot hidden" id="nav-update-dot" title="有可用更新" aria-label="有可用更新"></span>
        </button>
      </div>
      <!-- mac sidebar 底部: 当前版本号 (10.5pt tertiary) -->
      <div id="nav-version" class="nav-foot"></div>
    </nav>

    <!-- 分隔发线 -->
    <div class="nav-separator"></div>

    <!-- 右侧内容面板主区域 -->
    <main id="content-wrap" class="content-wrap">
      <div class="content-scroll">
        <!-- 状态行 (mac settingsErrorMessage 位置): 设置即时生效, 无全局保存栏 (C069) -->
        <div id="settings-status" class="settings-status" role="status"></div>
        <header class="pane-header">
          <div id="crumb" class="crumb">设置 / 通用</div>
          <h1 id="pane-title" class="pane-title">通用</h1>
        </header>

        <!-- 分类面板 1: 通用 -->
        <section id="pane-general" class="category-pane">
          <div id="pane-general-content"></div>
        </section>

        <!-- 分类面板 2: Agent 用量 -->
        <section id="pane-agentUsage" class="category-pane hidden">
          <div id="pane-agentUsage-content"></div>
        </section>

        <!-- 分类面板 3: 模型计费 -->
        <section id="pane-modelPricing" class="category-pane hidden">
          <div id="pane-modelPricing-content"></div>
        </section>

        <!-- 分类面板 4: 订阅额度 -->
        <section id="pane-subscription" class="category-pane hidden">
          <div id="pane-subscription-content"></div>
        </section>

        <!-- 分类面板 5: 授权与隐私 -->
        <section id="pane-consent" class="category-pane hidden">
          <div id="pane-consent-content"></div>
        </section>

        <!-- 分类面板 6: 维护 -->
        <section id="pane-maintenance" class="category-pane hidden">
          <div id="pane-maintenance-content"></div>
        </section>
      </div>

    </main>
  </div>
  <script src="provider-brand.js"></script>
  <script src="update-presentation.js"></script>
  <script src="settings.js"></script>
</body>
</html>
