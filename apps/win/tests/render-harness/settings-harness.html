<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Bruce · Windows 前端渲染自检 (设置窗口)</title>
<style>
  /* 设置窗口在 tauri.conf.json 中为 1000×680 (min 980×620), 这里复现其尺寸。 */
  html, body { width: 1000px; height: 680px; overflow: hidden; }
</style>
</head>
<body>
<script type="module">
// 设置窗口渲染自检 harness: 载入真实 settings.html body 标记 + settings.js + styles.css。
const [html, fixture, analytics] = await Promise.all([
  fetch("/apps/win/src/settings.html").then((r) => r.text()),
  fetch("/tests/fixtures/viewmodel-parity/agent-usage-valid.panel.json").then((r) => r.json()),
  // 工作台 (C070): mac 产出、Rust 对拍锁定的 golden, 按范围索引
  fetch("/tests/fixtures/viewmodel-parity/agent-usage-workbench.analytics.json").then((r) => r.json()),
]);
const analyticsByRange = Object.fromEntries(analytics.map((snapshot) => [snapshot.range, snapshot]));

const settings = {
  refreshIntervalSecs: 1800, notificationsEnabled: true, theme: "fluent",
  cardOrder: ["usage", "subscription", "hourly"], hotkey: "Control+Shift+B", consentVersion: 1,
  usageEnabled: true, enabledProviders: ["kimi", "codex", "claude", "deepseek", "volcengine", "zhipu", "grok", "opencodeGo", "stepfun", "cline"],
  providerOrder: [], pricingOverrides: {},
};
const listeners = new Map();
const accounts = [
  { field: "codexQuotaAccounts", accountId: "4eversivan", displayName: "Codex · sivan", authorizationState: "ok" },
  { field: "clineQuotaAccounts", accountId: "work", displayName: "Cline · work", authorizationState: "reauthRequired" },
];
const callLog = [];
window.__calls = callLog;
async function invoke(command, args) {
  callLog.push([command, args]);
  if (["export_billing", "export_diagnostics", "export_workbench_csv", "export_workbench_json"].includes(command)) {
    // 回显导出落点: 有对话框选定路径则用它, 否则给默认导出目录 (便于自检核对链路)
    return { path: args?.path || "C:\\Users\\sivan\\AppData\\Roaming\\Bruce\\exports\\default.csv" };
  }
  if (command === "get_settings") return structuredClone(settings);
  if (command === "save_settings_command") return null;
  if (command === "get_runtime_info") {
    return { version: "0.11.5", dataRoot: "C:\\Users\\sivan\\AppData\\Roaming\\Bruce", cacheRoot: "C:\\Users\\sivan\\AppData\\Local\\Bruce\\collector-cache-v1",
      snapshotPath: "…\\snapshots\\agent-usage.json", status: { phase: "fresh", lastSuccessAt: "2026-07-28T12:00:00Z", error: null, diagnosticCodes: [] } };
  }
  if (command === "plugin:dialog|save") return "C:\\Users\\sivan\\Desktop\\Bruce-billing.csv";
  if (command === "get_model_prices") {
    return [
      { model: "k3-agent", displayName: "Kimi K3 (Agent)", vendor: "Moonshot Kimi", inputPricePerMillion: 3, outputPricePerMillion: 15, cacheReadPricePerMillion: 0.3, currency: "USD", note: "Kimi K3 Agent" },
      { model: "gpt-5.4", displayName: "GPT-5.4", vendor: "OpenAI / Codex", inputPricePerMillion: 0.55, outputPricePerMillion: 2.19, cacheReadPricePerMillion: 0.14, currency: "USD", note: "GPT-5.4" },
      { model: "claude-sonnet-5", displayName: "Claude Sonnet 5", vendor: "Anthropic", inputPricePerMillion: 3, outputPricePerMillion: 15, cacheReadPricePerMillion: 0.3, currency: "USD", note: "Claude Sonnet 5" },
    ];
  }
  if (command === "credential_allowlist") return ["kimiQuotaAccounts", "codexQuotaAccounts", "clineQuotaAccounts", "providerMeta"];
  if (command === "get_credential_fields") return ["codexQuotaAccounts", "clineQuotaAccounts"];
  if (command === "get_credential_accounts") return structuredClone(accounts);
  if (command === "get_dashboard") return structuredClone(fixture);
  if (command === "get_usage_analytics") return structuredClone(analyticsByRange[args.range] ?? null);
  return null;
}
async function listen(name, callback) { listeners.set(name, [...(listeners.get(name) || []), callback]); return () => {}; }
window.__TAURI__ = { core: { invoke }, event: { listen } };
window.__emit = async (name, payload) => {
  await Promise.all((listeners.get(name) || []).map((cb) => cb({ payload })));
};
window.__setCategory = (key) => document.querySelector(`[data-category="${key}"]`)?.click();

const doc = new DOMParser().parseFromString(html, "text/html");
const link = document.createElement("link");
link.rel = "stylesheet";
link.href = `/apps/win/src/styles.css?v=${Date.now()}`;
document.head.append(link);
document.body.className = doc.body.className;
document.body.innerHTML = doc.body.innerHTML;
// 生产脚本清单直接取自 settings.html (TD-011 拆分后按 settings-state → 分节 → settings.js
// 的顺序加载); 动态插入时 async=false 保证经典脚本按序执行, 最后一个 onload 标记就绪。
const scripts = [...doc.querySelectorAll("script[src]")].map((el) => el.getAttribute("src"));
let last = null;
for (const src of scripts) {
  const script = document.createElement("script");
  script.src = `/apps/win/src/${src}?v=${Date.now()}`;
  script.async = false;
  document.body.append(script);
  last = script;
}
if (last) last.onload = () => { window.__ready = true; };
</script>
</body>
</html>
