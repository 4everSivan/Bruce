[package]
name = "bruce-win-viewmodel"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
collector-domain = { path = "../../../core/collector/crates/collector-domain" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: mac JSONEncoder 的 17 位浮点表示需精确解析, 否则对拍差 1 ULP
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "=0.4.38", default-features = false, features = ["std"] }
