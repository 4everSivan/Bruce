<svg xmlns="http://www.w3.org/2000/svg" id="d_b8c03e41-f102-4ff4-a34f-026c09168989" viewBox="0 0 1000 580" role="img" aria-labelledby="d_b8c03e41-f102-4ff4-a34f-026c09168989-title d_b8c03e41-f102-4ff4-a34f-026c09168989-desc"><title id="d_b8c03e41-f102-4ff4-a34f-026c09168989-title">桌面安装的 Collector 进程位置</title><desc id="d_b8c03e41-f102-4ff4-a34f-026c09168989-desc">桌面安装的 Collector 进程位置。静态实现或配置关系，箭头含义见正文。</desc><defs><style>text {font-family:-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;fill:#243247} </style><marker id="d_b8c03e41-f102-4ff4-a34f-026c09168989-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#516176"/></marker></defs><rect width="1000" height="580" fill="#fff"/><text x="500.0" y="38" text-anchor="middle" style="font-size:24px;fill:#243247"><tspan x="500.0" dy="0">桌面安装的 Collector 进程位置</tspan></text><text x="500" y="76" text-anchor="middle" style="font-size:17px;fill:#243247"><tspan x="500" dy="0">由组包脚本与调用代码确定；非现场运行观测</tspan></text><g id="d_b8c03e41-f102-4ff4-a34f-026c09168989-mac" data-group-id="mac"><rect x="40" y="110" width="440" height="390" rx="8" fill="#f8fafc" stroke="#768397" stroke-width="1.5"/><text x="260" y="145" text-anchor="middle" style="font-size:19px;fill:#243247"><tspan x="260" dy="0">macOS 安装：同一用户环境</tspan></text></g><g id="d_b8c03e41-f102-4ff4-a34f-026c09168989-win" data-group-id="win"><rect x="520" y="110" width="440" height="390" rx="8" fill="#f8fafc" stroke="#768397" stroke-width="1.5"/><text x="740" y="145" text-anchor="middle" style="font-size:19px;fill:#243247"><tspan x="740" dy="0">Windows 安装：另一平台环境</tspan></text></g><g id="d_b8c03e41-f102-4ff4-a34f-026c09168989-stdio" data-relation-id="stdio"><path d="M 260 270 L 260 370" fill="none" stroke="#516176" stroke-width="1.5" marker-end="url(#d_b8c03e41-f102-4ff4-a34f-026c09168989-arrow)"/><rect x="80.0" y="303" width="360" height="28" fill="#fff"/><text x="260" y="324" text-anchor="middle" style="font-size:16px;fill:#243247"><tspan x="260" dy="0">stdin/stdout：Bridge JSON</tspan></text></g><g id="d_b8c03e41-f102-4ff4-a34f-026c09168989-app" data-node-id="app"><rect x="80" y="180" width="360" height="90" rx="6" fill="#fff" stroke="#768397" stroke-width="1.5"/><text x="260.0" y="210" text-anchor="middle" style="font-size:18px;fill:#243247"><tspan x="260.0" dy="0">BruceApp 主进程</tspan><tspan x="260.0" dy="27.0">调度、凭据与快照</tspan></text></g><g id="d_b8c03e41-f102-4ff4-a34f-026c09168989-cli" data-node-id="cli"><rect x="80" y="370" width="360" height="90" rx="6" fill="#fff" stroke="#768397" stroke-width="1.5"/><text x="260.0" y="400" text-anchor="middle" style="font-size:18px;fill:#243247"><tspan x="260.0" dy="0">内置 Bruce-collector 子进程</tspan><tspan x="260.0" dy="27.0">一次请求后结束</tspan></text></g><g id="d_b8c03e41-f102-4ff4-a34f-026c09168989-tauri" data-node-id="tauri"><rect x="560" y="240" width="360" height="140" rx="6" fill="#fff" stroke="#768397" stroke-width="1.5"/><text x="740.0" y="270" text-anchor="middle" style="font-size:18px;fill:#243247"><tspan x="740.0" dy="0">Tauri 原生进程</tspan><tspan x="740.0" dy="27.0">内含共享 Bridge / Collector</tspan><tspan x="740.0" dy="27.0">在进程内调用，不另启 CLI</tspan></text></g><text x="500" y="550" text-anchor="middle" style="font-size:17px;fill:#243247"><tspan x="500" dy="0">未表示平台间网络连接；独立 Widget 宿主见其专文</tspan></text></svg>
