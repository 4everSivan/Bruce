<svg xmlns="http://www.w3.org/2000/svg" id="d_34942c0a-0796-4135-bbb5-7626b5914373" viewBox="0 0 1100 680" role="img" aria-labelledby="d_34942c0a-0796-4135-bbb5-7626b5914373-title d_34942c0a-0796-4135-bbb5-7626b5914373-desc"><title id="d_34942c0a-0796-4135-bbb5-7626b5914373-title">macOS 价格覆盖保存与刷新顺序</title><desc id="d_34942c0a-0796-4135-bbb5-7626b5914373-desc">macOS 价格覆盖保存与刷新顺序。静态实现或配置关系，箭头含义见正文。</desc><defs><style>text {font-family:-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;fill:#243247} </style><marker id="d_34942c0a-0796-4135-bbb5-7626b5914373-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#516176"/></marker></defs><rect width="1100" height="680" fill="#fff"/><text x="550.0" y="38" text-anchor="middle" style="font-size:24px;fill:#243247"><tspan x="550.0" dy="0">macOS 价格覆盖保存与刷新顺序</tspan></text><text x="550" y="75" text-anchor="middle" style="font-size:17px;fill:#243247"><tspan x="550" dy="0">实线为同步调用；虚线为返回。成功、失败区域互斥。</tspan></text><line x1="80" y1="145" x2="80" y2="650" stroke="#768397" stroke-dasharray="5 5"/><line x1="390" y1="145" x2="390" y2="650" stroke="#768397" stroke-dasharray="5 5"/><line x1="700" y1="145" x2="700" y2="650" stroke="#768397" stroke-dasharray="5 5"/><line x1="990" y1="145" x2="990" y2="650" stroke="#768397" stroke-dasharray="5 5"/><rect x="300" y="365" width="770" height="170" fill="#f8fafc" stroke="#768397"/><text x="320" y="392" text-anchor="start" style="font-size:17px;fill:#243247"><tspan x="320" dy="0">成功：save 未抛错</tspan></text><rect x="300" y="550" width="770" height="94" fill="#f8fafc" stroke="#768397"/><text x="320" y="576" text-anchor="start" style="font-size:17px;fill:#243247"><tspan x="320" dy="0">失败：save 抛错</tspan></text><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-edit" data-relation-id="edit"><path d="M 80 190 L 390 190" fill="none" stroke="#516176" stroke-width="1.5" marker-end="url(#d_34942c0a-0796-4135-bbb5-7626b5914373-arrow)"/><rect x="172.0" y="159" width="120" height="28" fill="#fff"/><text x="232" y="180" text-anchor="middle" style="font-size:16px;fill:#243247"><tspan x="232" dy="0">1. 提交覆盖项</tspan></text></g><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-memory" data-relation-id="memory"><path d="M 390 230 L 455 230 L 455 260 L 390 260" fill="none" stroke="#516176" stroke-width="1.5" marker-end="url(#d_34942c0a-0796-4135-bbb5-7626b5914373-arrow)"/><rect x="565.5" y="226" width="195" height="28" fill="#fff"/><text x="663" y="247" text-anchor="middle" style="font-size:16px;fill:#243247"><tspan x="663" dy="0">2. 先更新已发布内存集合</tspan></text></g><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-save" data-relation-id="save"><path d="M 390 325 L 700 325" fill="none" stroke="#516176" stroke-width="1.5" marker-end="url(#d_34942c0a-0796-4135-bbb5-7626b5914373-arrow)"/><rect x="380.0" y="294" width="330" height="28" fill="#fff"/><text x="545" y="315" text-anchor="middle" style="font-size:16px;fill:#243247"><tspan x="545" dy="0">3. load 后 save(config)</tspan></text></g><text x="545" y="350" text-anchor="middle" style="font-size:15px;fill:#243247"><tspan x="545" dy="0">前提：configStore 可用</tspan></text><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-success" data-relation-id="success"><path d="M 700 440 L 390 440" fill="none" stroke="#516176" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#d_34942c0a-0796-4135-bbb5-7626b5914373-arrow)"/><rect x="492.5" y="409" width="105" height="28" fill="#fff"/><text x="545" y="430" text-anchor="middle" style="font-size:16px;fill:#243247"><tspan x="545" dy="0">4. 保存成功</tspan></text></g><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-refresh" data-relation-id="refresh"><path d="M 390 510 L 990 510" fill="none" stroke="#516176" stroke-width="1.5" marker-end="url(#d_34942c0a-0796-4135-bbb5-7626b5914373-arrow)"/><rect x="435.0" y="479" width="510" height="28" fill="#fff"/><text x="690" y="500" text-anchor="middle" style="font-size:16px;fill:#243247"><tspan x="690" dy="0">5. refresh(.agentUsage)：提交意图，不等待采集</tspan></text></g><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-error" data-relation-id="error"><path d="M 700 615 L 390 615" fill="none" stroke="#516176" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#d_34942c0a-0796-4135-bbb5-7626b5914373-arrow)"/><rect x="455.0" y="584" width="270" height="28" fill="#fff"/><text x="590" y="605" text-anchor="middle" style="font-size:16px;fill:#243247"><tspan x="590" dy="0">6. 错误返回；提示失败，内存不回滚</tspan></text></g><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-view" data-node-id="view"><rect x="5.0" y="98" width="150" height="48" rx="6" fill="#fff" stroke="#768397" stroke-width="1.5"/><text x="80.0" y="128" text-anchor="middle" style="font-size:18px;fill:#243247"><tspan x="80.0" dy="0">价格编辑视图</tspan></text></g><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-coordinator" data-node-id="coordinator"><rect x="255.0" y="98" width="270" height="48" rx="6" fill="#fff" stroke="#768397" stroke-width="1.5"/><text x="390.0" y="128" text-anchor="middle" style="font-size:18px;fill:#243247"><tspan x="390.0" dy="0">OnboardingCoordinator</tspan></text></g><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-store" data-node-id="store"><rect x="592.5" y="98" width="215" height="48" rx="6" fill="#fff" stroke="#768397" stroke-width="1.5"/><text x="700.0" y="128" text-anchor="middle" style="font-size:18px;fill:#243247"><tspan x="700.0" dy="0">ConfigurationStore</tspan></text></g><g id="d_34942c0a-0796-4135-bbb5-7626b5914373-scheduler" data-node-id="scheduler"><rect x="890.0" y="98" width="200" height="48" rx="6" fill="#fff" stroke="#768397" stroke-width="1.5"/><text x="990.0" y="128" text-anchor="middle" style="font-size:18px;fill:#243247"><tspan x="990.0" dy="0">RefreshScheduler</tspan></text></g></svg>
