<svg xmlns="http://www.w3.org/2000/svg" id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4" viewBox="0 0 1100 830" role="img" aria-labelledby="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-title d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-desc"><title id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-title">Windows 重检命令与结果事件</title><desc id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-desc">命令返回与后台发布是不同交接点；只表示一个合法成功场景。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;fill:#243247}</style><marker id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#516176"/></marker><marker id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#516176" stroke-width="1.5"/></marker></defs><rect width="1100" height="830" fill="#fff"/><text x="550" y="36" text-anchor="middle" font-size="24">Windows 重检命令与结果事件</text><text x="550" y="74" text-anchor="middle" font-size="17">成功示例：后台采集晚于缓存读取；二者实际没有固定全序</text><line x1="80" y1="145" x2="80" y2="785" stroke="#768397" stroke-dasharray="5 5"/><line x1="400" y1="145" x2="400" y2="785" stroke="#768397" stroke-dasharray="5 5"/><line x1="720" y1="145" x2="720" y2="785" stroke="#768397" stroke-dasharray="5 5"/><line x1="1000" y1="145" x2="1000" y2="785" stroke="#768397" stroke-dasharray="5 5"/><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-request" data-relation-id="request"><line x1="80" y1="190" x2="400" y2="190" stroke="#516176" stroke-width="1.5" marker-end="url(#d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-arrow)"/><rect x="142.0" y="157" width="196" height="27" fill="#fff"/><text x="240.0" y="178" text-anchor="middle" font-size="17">1. refresh_now</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-enqueue" data-relation-id="enqueue"><line x1="400" y1="250" x2="720" y2="250" stroke="#516176" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-open)"/><rect x="399.0" y="217" width="322" height="27" fill="#fff"/><text x="560.0" y="238" text-anchor="middle" font-size="17">2. try_send 刷新意图（结果被忽略）</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-returned" data-relation-id="returned"><line x1="400" y1="310" x2="80" y2="310" stroke="#516176" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-arrow)"/><rect x="135.0" y="277" width="210" height="27" fill="#fff"/><text x="240.0" y="298" text-anchor="middle" font-size="17">3. 命令返回，不确认采集完成</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-read" data-relation-id="read"><line x1="80" y1="380" x2="400" y2="380" stroke="#516176" stroke-width="1.5" marker-end="url(#d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-arrow)"/><rect x="65.0" y="347" width="350" height="27" fill="#fff"/><text x="240.0" y="368" text-anchor="middle" font-size="17">4. 读取运行信息 / get_dashboard</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-cache-read" data-relation-id="cache-read"><line x1="400" y1="450" x2="1000" y2="450" stroke="#516176" stroke-width="1.5" marker-end="url(#d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-arrow)"/><rect x="609.0" y="417" width="182" height="27" fill="#fff"/><text x="700.0" y="438" text-anchor="middle" font-size="17">5. 读取当前缓存，非采集</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-cache-return" data-relation-id="cache-return"><line x1="1000" y1="510" x2="400" y2="510" stroke="#516176" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-arrow)"/><rect x="616.0" y="477" width="168" height="27" fill="#fff"/><text x="700.0" y="498" text-anchor="middle" font-size="17">6. 当前面板，可能仍旧</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-panel" data-relation-id="panel"><line x1="400" y1="570" x2="80" y2="570" stroke="#516176" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-arrow)"/><rect x="177.0" y="537" width="126" height="27" fill="#fff"/><text x="240.0" y="558" text-anchor="middle" font-size="17">7. 先用缓存重绘</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-publish" data-relation-id="publish"><line x1="720" y1="665" x2="1000" y2="665" stroke="#516176" stroke-width="1.5" marker-end="url(#d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-arrow)"/><rect x="776.0" y="632" width="168" height="27" fill="#fff"/><text x="860.0" y="653" text-anchor="middle" font-size="17">8. 采集成功后更新快照</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-event" data-relation-id="event"><line x1="720" y1="745" x2="80" y2="745" stroke="#516176" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-open)"/><rect x="204.0" y="712" width="392" height="27" fill="#fff"/><text x="400.0" y="733" text-anchor="middle" font-size="17">9. dashboard-updated，替换面板并重绘</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-view" data-node-id="view"><rect x="2.5" y="98" width="155" height="48" rx="5" fill="#fff" stroke="#768397"/><text x="80" y="128" text-anchor="middle" font-size="18">设置页</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-ipc" data-node-id="ipc"><rect x="322.5" y="98" width="155" height="48" rx="5" fill="#fff" stroke="#768397"/><text x="400" y="128" text-anchor="middle" font-size="18">Tauri IPC</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-worker" data-node-id="worker"><rect x="642.5" y="98" width="155" height="48" rx="5" fill="#fff" stroke="#768397"/><text x="720" y="128" text-anchor="middle" font-size="18">后台循环</text></g><g id="d_1a5b580c-b59f-4bdd-8cc5-5b15a0aa46a4-snapshot" data-node-id="snapshot"><rect x="922.5" y="98" width="155" height="48" rx="5" fill="#fff" stroke="#768397"/><text x="1000" y="128" text-anchor="middle" font-size="18">缓存快照</text></g><text x="550" y="803" text-anchor="middle" font-size="16">实线：同步调用；虚线实心：返回；虚线空心：异步通道或事件</text></svg>
