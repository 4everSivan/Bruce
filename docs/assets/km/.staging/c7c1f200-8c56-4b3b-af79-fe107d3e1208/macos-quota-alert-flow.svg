<svg xmlns="http://www.w3.org/2000/svg" id="d_ef3a4739-f224-4a72-b833-2253075f4e26" viewBox="0 0 1000 1040" role="img" aria-labelledby="d_ef3a4739-f224-4a72-b833-2253075f4e26-title d_ef3a4739-f224-4a72-b833-2253075f4e26-desc"><title id="d_ef3a4739-f224-4a72-b833-2253075f4e26-title">macOS 额度预警评估与气泡</title><desc id="d_ef3a4739-f224-4a72-b833-2253075f4e26-desc">工件发布后计算阈值与已见档位，非手动新跨越且开关启用时在状态项显示气泡。</desc><defs><style>#d_ef3a4739-f224-4a72-b833-2253075f4e26 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; } #d_ef3a4739-f224-4a72-b833-2253075f4e26 text { fill: #243247; font-size: 17px; } #d_ef3a4739-f224-4a72-b833-2253075f4e26 .small { fill: #516176; font-size: 15px; } #d_ef3a4739-f224-4a72-b833-2253075f4e26 .node { fill: #ffffff; stroke: #768397; stroke-width: 1.5; } #d_ef3a4739-f224-4a72-b833-2253075f4e26 .connector { fill: none; stroke: #516176; stroke-width: 1.5; }</style><marker id="d_ef3a4739-f224-4a72-b833-2253075f4e26-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#516176"/></marker></defs><rect x="0" y="0" width="1000" height="1040" fill="#ffffff"/><text x="32" y="38" style="font-size:22px">macOS 额度预警评估与气泡</text><text x="32" y="68" class="small">常规显示路径；阈值为 &gt;50%、&gt;80% 与 ≥95%，手动轮次也更新记录。</text><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-to-eval" data-relation-id="to-eval"><path d="M500 162V200" class="connector" marker-end="url(#d_ef3a4739-f224-4a72-b833-2253075f4e26-arrow)"/></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-to-dedup" data-relation-id="to-dedup"><path d="M500 276V312" class="connector" marker-end="url(#d_ef3a4739-f224-4a72-b833-2253075f4e26-arrow)"/></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-to-crossing" data-relation-id="to-crossing"><path d="M500 388V430" class="connector" marker-end="url(#d_ef3a4739-f224-4a72-b833-2253075f4e26-arrow)"/></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-cross-yes" data-relation-id="cross-yes"><path d="M500 570V614" class="connector" marker-end="url(#d_ef3a4739-f224-4a72-b833-2253075f4e26-arrow)"/><text x="516" y="596" class="small">是</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-cross-no" data-relation-id="cross-no"><path d="M700 500H930V944H625" class="connector" marker-end="url(#d_ef3a4739-f224-4a72-b833-2253075f4e26-arrow)"/><text x="720" y="492" class="small">否</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-show-yes" data-relation-id="show-yes"><path d="M500 754V800" class="connector" marker-end="url(#d_ef3a4739-f224-4a72-b833-2253075f4e26-arrow)"/><text x="516" y="780" class="small">是</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-show-no" data-relation-id="show-no"><path d="M700 684H865V930H625" class="connector" marker-end="url(#d_ef3a4739-f224-4a72-b833-2253075f4e26-arrow)"/><text x="720" y="676" class="small">否</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-finish" data-relation-id="finish"><path d="M500 866V910" class="connector" marker-end="url(#d_ef3a4739-f224-4a72-b833-2253075f4e26-arrow)"/></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-start" data-node-id="start"><rect x="375" y="105" width="250" height="57" rx="28" class="node"/><text x="500" y="139.5" text-anchor="middle">工件发布成功</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-evaluate" data-node-id="evaluate"><rect x="285" y="200" width="430" height="76" rx="5" class="node"/><text x="500" y="233" text-anchor="middle">过滤陈旧服务和非 5 小时窗口</text><text x="500" y="255" text-anchor="middle">计算当前预警阶梯</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-dedup" data-node-id="dedup"><rect x="285" y="312" width="430" height="76" rx="5" class="node"/><text x="500" y="356" text-anchor="middle">比较已见最高档并同步记录</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-crossing" data-node-id="crossing"><path d="M500 430 L700 500 L500 570 L300 500 Z" class="node"/><text x="500" y="506" text-anchor="middle">非手动且有更高档位？</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-can-show" data-node-id="can-show"><path d="M500 614 L700 684 L500 754 L300 684 Z" class="node"/><text x="500" y="690" text-anchor="middle">预警开启且状态项可用？</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-bubble" data-node-id="bubble"><rect x="350" y="800" width="300" height="66" rx="5" class="node"/><text x="500" y="839" text-anchor="middle">显示非激活气泡</text></g><g id="d_ef3a4739-f224-4a72-b833-2253075f4e26-end" data-node-id="end"><rect x="375" y="910" width="250" height="62" rx="30" class="node"/><text x="500" y="947" text-anchor="middle">本轮结束</text></g><text x="32" y="1005" class="small">不在当前条目中的窗口会移除已见记录；气泡未显示不改变本轮同步结果。</text></svg>