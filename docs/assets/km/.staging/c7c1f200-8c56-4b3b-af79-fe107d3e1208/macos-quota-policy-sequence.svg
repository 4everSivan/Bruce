<svg xmlns="http://www.w3.org/2000/svg" id="d_a316352d-4834-406a-b2de-85a87dec47ce" viewBox="0 0 920 570" role="img" aria-labelledby="d_a316352d-4834-406a-b2de-85a87dec47ce-title d_a316352d-4834-406a-b2de-85a87dec47ce-desc"><title id="d_a316352d-4834-406a-b2de-85a87dec47ce-title">macOS 额度门禁进程内策略交接</title><desc id="d_a316352d-4834-406a-b2de-85a87dec47ce-desc">非定向轮次在读取历史工件后调用共享策略；无效或错误响应使本轮停止并保留旧工件。</desc><defs><style>#d_a316352d-4834-406a-b2de-85a87dec47ce { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; } #d_a316352d-4834-406a-b2de-85a87dec47ce text { fill: #243247; font-size: 17px; } #d_a316352d-4834-406a-b2de-85a87dec47ce .small { fill: #516176; font-size: 15px; } #d_a316352d-4834-406a-b2de-85a87dec47ce .node { fill: #ffffff; stroke: #768397; stroke-width: 1.5; } #d_a316352d-4834-406a-b2de-85a87dec47ce .connector { fill: none; stroke: #516176; stroke-width: 1.5; }</style><marker id="d_a316352d-4834-406a-b2de-85a87dec47ce-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#516176"/></marker></defs><rect x="0" y="0" width="920" height="570" fill="#ffffff"/><text x="32" y="38" style="font-size:22px">macOS 额度门禁进程内策略交接</text><text x="32" y="68" class="small">前提：非定向轮次已读取历史工件；策略请求不包含凭据。</text><g id="d_a316352d-4834-406a-b2de-85a87dec47ce-pipeline" data-node-id="pipeline"><rect x="60" y="95" width="190" height="48" rx="5" class="node"/><text x="155" y="125" text-anchor="middle">刷新流水线</text><line x1="155" y1="143" x2="155" y2="500" stroke="#768397" stroke-dasharray="5 5"/></g><g id="d_a316352d-4834-406a-b2de-85a87dec47ce-policy" data-node-id="policy"><rect x="365" y="95" width="190" height="48" rx="5" class="node"/><text x="460" y="125" text-anchor="middle">额度策略客户端</text><line x1="460" y1="143" x2="460" y2="500" stroke="#768397" stroke-dasharray="5 5"/></g><g id="d_a316352d-4834-406a-b2de-85a87dec47ce-ffi" data-node-id="ffi"><rect x="665" y="95" width="190" height="48" rx="5" class="node"/><text x="760" y="125" text-anchor="middle">共享策略 C ABI</text><line x1="760" y1="143" x2="760" y2="500" stroke="#768397" stroke-dasharray="5 5"/></g><g id="d_a316352d-4834-406a-b2de-85a87dec47ce-plan" data-relation-id="plan"><path d="M155 220H460" class="connector"  marker-end="url(#d_a316352d-4834-406a-b2de-85a87dec47ce-arrow)"/><rect x="185" y="186" width="245" height="27" fill="#fff"/><text x="307.5" y="205" text-anchor="middle">1. 请求额度门禁</text></g><g id="d_a316352d-4834-406a-b2de-85a87dec47ce-request" data-relation-id="request"><path d="M460 300H760" class="connector"  marker-end="url(#d_a316352d-4834-406a-b2de-85a87dec47ce-arrow)"/><rect x="490" y="266" width="240" height="27" fill="#fff"/><text x="610" y="285" text-anchor="middle">2. quotaPlan JSON 字节</text></g><g id="d_a316352d-4834-406a-b2de-85a87dec47ce-response" data-relation-id="response"><path d="M760 380H460" class="connector" stroke-dasharray="6 4" marker-end="url(#d_a316352d-4834-406a-b2de-85a87dec47ce-arrow)"/><rect x="490" y="346" width="240" height="27" fill="#fff"/><text x="610" y="365" text-anchor="middle">3. 响应字节</text></g><g id="d_a316352d-4834-406a-b2de-85a87dec47ce-result" data-relation-id="result"><path d="M460 460H155" class="connector" stroke-dasharray="6 4" marker-end="url(#d_a316352d-4834-406a-b2de-85a87dec47ce-arrow)"/><rect x="185" y="426" width="245" height="27" fill="#fff"/><text x="307.5" y="445" text-anchor="middle">4. 策略或错误</text></g><text x="32" y="533" class="small">实线：调用；虚线：返回。失败时不启动采集；定向轮次使用独立路径。</text></svg>