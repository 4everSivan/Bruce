<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d_d297e50d-170e-4fc9-99e1-e52f41fd8a16-title d_d297e50d-170e-4fc9-99e1-e52f41fd8a16-desc" viewBox="0 0 1000 320">
<title id="d_d297e50d-170e-4fc9-99e1-e52f41fd8a16-title">双端共享策略调用边界</title>
<desc id="d_d297e50d-170e-4fc9-99e1-e52f41fd8a16-desc">macOS 通过 C ABI 调用共享策略，Windows 在进程内直接调用同一 Rust 核心。调用方负责外围调度，核心负责纯计算。</desc>
<defs><marker id="d_d297e50d-170e-4fc9-99e1-e52f41fd8a16-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#516176"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#243247;font-size:16px}.sub{font-size:14px;fill:#516176}.box{fill:#fff;stroke:#768397;stroke-width:1.5}.edge{fill:none;stroke:#516176;stroke-width:1.5;marker-end:url(#d_d297e50d-170e-4fc9-99e1-e52f41fd8a16-arrow)}</style>
<rect width="1000" height="320" fill="#fff"/><text x="32" y="35" font-size="19">双端共享策略调用边界</text><text x="32" y="58" class="sub">仅表示源码调用；外围调度、网络与持久化不属于策略核心</text>
<g data-relation-id="mac-ffi"><path class="edge" d="M250 125 H330"/><text x="290" y="87" text-anchor="middle" class="sub">JSON 字节</text></g>
<g data-relation-id="ffi-policy"><path class="edge" d="M530 125 H690"/><text x="553" y="111" class="sub">handle_request</text></g>
<g data-relation-id="win-policy"><path class="edge" d="M250 235 H635 V165 H690"/><text x="375" y="222" class="sub">Rust 进程内调用</text></g>
<g data-node-id="mac"><rect class="box" x="50" y="95" width="200" height="60" rx="8"/><text x="150" y="121" text-anchor="middle">macOS 调用方</text><text x="150" y="143" text-anchor="middle" class="sub">编码请求、读取结果</text></g>
<g data-node-id="ffi"><rect class="box" x="330" y="95" width="200" height="60" rx="8"/><text x="430" y="121" text-anchor="middle">策略 C ABI</text><text x="430" y="143" text-anchor="middle" class="sub">调用 / 释放缓冲区</text></g>
<g data-node-id="policy"><rect class="box" x="690" y="95" width="250" height="70" rx="8"/><text x="815" y="123" text-anchor="middle">collector-policy</text><text x="815" y="146" text-anchor="middle" class="sub">门禁、回填、边界、退避</text></g>
<g data-node-id="win"><rect class="box" x="50" y="205" width="200" height="60" rx="8"/><text x="150" y="231" text-anchor="middle">Windows 刷新宿主</text><text x="150" y="253" text-anchor="middle" class="sub">组装上下文并应用结果</text></g>
</svg>
