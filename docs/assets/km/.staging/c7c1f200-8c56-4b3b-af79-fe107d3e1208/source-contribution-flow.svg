<title id="d_2873df93-a3b4-4c39-afb2-e65f8aeee860-title">本地来源任务与结果处理</title><desc id="d_2873df93-a3b4-4c39-afb2-e65f8aeee860-desc">本地授权与 home 检查后，工作池并行扫描九个来源并按原序收集；取消或缺少 home 返回诊断。</desc>
