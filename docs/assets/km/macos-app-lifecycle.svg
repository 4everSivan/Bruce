<rect x="313" y="347.5" width="124" height="25" fill="#fff" /><text text-anchor="middle">
<tspan x="375" y="364.5">不等待外部凭据</tspan>
</text>
</g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-r3" data-relation-id="r3"><polyline class="connector" points="470,440 510,440 510,64 740,64 740,78" marker-end="url(#d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-arrow)" />
<rect x="440" y="192.5" width="140" height="25" fill="#fff" /><text text-anchor="middle">
<tspan x="510" y="209.5">应用生命周期继续</tspan>
</text>
</g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-r4" data-relation-id="r4"><polyline class="connector" points="740,162 740,238" marker-end="url(#d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-arrow)" />
<rect x="768.6" y="187.5" width="152.8" height="25" fill="#fff" /><text text-anchor="middle">
