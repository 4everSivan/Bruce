<svg xmlns="http://www.w3.org/2000/svg" id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb" viewBox="0 0 1000 764" role="img" aria-labelledby="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-title d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-desc">
<title id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-title">macOS 应用生命周期</title>
<desc id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-desc">启动与退出顺序；取消退出由正文说明，不在此线性退出图展开</desc>
<defs><style>#d_62f7970a-5036-440c-bd91-5fbcac4a7fbb{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif} text{fill:#243247;font-size:16px} .node{fill:#fff;stroke:#768397;stroke-width:1.5} .connector{fill:none;stroke:#516176;stroke-width:1.5}</style><marker id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#516176" /></marker></defs>
<rect width="1000" height="764" fill="#fff" />
<text x="24" y="30" style="font-size:20px;font-weight:600">macOS 应用生命周期</text>
