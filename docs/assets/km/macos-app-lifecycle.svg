<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-r5" data-relation-id="r5"><polyline class="connector" points="740,322 740,394" marker-end="url(#d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-arrow)" />
<rect x="799" y="345.5" width="92" height="25" fill="#fff" /><text text-anchor="middle">
<tspan x="845" y="362.5">检查执行器</tspan>
</text>
</g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-r6" data-relation-id="r6"><polyline class="connector" points="740,526 740,618" marker-end="url(#d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-arrow)" />
<rect x="831" y="559.5" width="28" height="25" fill="#fff" /><text text-anchor="middle">
<tspan x="845" y="576.5">是</tspan>
</text>
</g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-r7" data-relation-id="r7"><polyline class="connector" points="560,460 520,460 520,560 270,560 270,618" marker-end="url(#d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-arrow)" />
