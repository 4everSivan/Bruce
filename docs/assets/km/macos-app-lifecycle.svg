<rect x="467" y="617.5" width="76" height="25" fill="#fff" /><text text-anchor="middle">
<tspan x="505" y="634.5">宽限回调</tspan>
</text>
</g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-boot" data-node-id="boot">
<rect class="node" x="70" y="78" width="400" height="84" rx="22" />
<text text-anchor="middle">
