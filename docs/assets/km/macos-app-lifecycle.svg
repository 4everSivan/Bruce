</text></g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-cache" data-node-id="cache">
<rect class="node" x="70" y="238" width="400" height="84" rx="5" />
<text text-anchor="middle">
<tspan x="270" y="285.5">启动调度并读取本地快照</tspan>
</text></g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-ready" data-node-id="ready">
<rect class="node" x="70" y="398" width="400" height="84" rx="5" />
<text text-anchor="middle">
<tspan x="270" y="445.5">按配置准备凭据并协调模块</tspan>
</text></g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-quit" data-node-id="quit">
<rect class="node" x="540" y="78" width="400" height="84" rx="5" />
