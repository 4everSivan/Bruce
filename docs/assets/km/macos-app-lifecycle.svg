<tspan x="740" y="125.5">收到退出请求</tspan>
</text></g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-stop" data-node-id="stop">
<rect class="node" x="540" y="238" width="400" height="84" rx="5" />
<text text-anchor="middle">
<tspan x="740" y="285.5">停止调度并取消运行任务</tspan>
</text></g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-pending" data-node-id="pending">
<polygon class="node" points="740,394 920,460 740,526 560,460" />
<text text-anchor="middle">
<tspan x="740" y="465.5">仍有运行任务？</tspan>
</text></g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-wait" data-node-id="wait">
<rect class="node" x="540" y="618" width="400" height="84" rx="5" />
<text text-anchor="middle">
<tspan x="740" y="665.5">等待 2 秒，必要时强制终止</tspan>
</text></g>
<g id="d_62f7970a-5036-440c-bd91-5fbcac4a7fbb-end" data-node-id="end">
<rect class="node" x="70" y="618" width="400" height="84" rx="22" />
<text text-anchor="middle">
<tspan x="270" y="665.5">回复系统完成退出</tspan>
</text></g>
