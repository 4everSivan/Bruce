<svg xmlns="http://www.w3.org/2000/svg" id="d_a41b7373-2867-4803-820c-c1bba0c5fe64" viewBox="0 0 1000 460" role="img" aria-labelledby="d_a41b7373-2867-4803-820c-c1bba0c5fe64-title d_a41b7373-2867-4803-820c-c1bba0c5fe64-desc"><title id="d_a41b7373-2867-4803-820c-c1bba0c5fe64-title">自动刷新网络门禁</title><desc id="d_a41b7373-2867-4803-820c-c1bba0c5fe64-desc">此图抽象网络门禁；offlinePaused 是补偿标记，五个模块相位不变。</desc><defs><style>#d_a41b7373-2867-4803-820c-c1bba0c5fe64{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}text{fill:#243247;font-size:18px}.small{font-size:15px;fill:#516176}.edge{fill:none;stroke:#516176;stroke-width:1.5}</style><marker id="d_a41b7373-2867-4803-820c-c1bba0c5fe64-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#516176" /></marker></defs><rect width="1000" height="460" fill="#fff" /><text x="40" y="40" style="font-size:24px">自动刷新网络门禁</text>
<g id="d_a41b7373-2867-4803-820c-c1bba0c5fe64-left" data-node-id="left"><rect x="100" y="115" width="280" height="90" rx="8" fill="#fff" stroke="#768397" stroke-width="1.5" /><text x="240" y="154" text-anchor="middle">网络可用</text><text x="240" y="181" text-anchor="middle" class="small">初始状态</text></g>
<g id="d_a41b7373-2867-4803-820c-c1bba0c5fe64-right" data-node-id="right"><rect x="620" y="115" width="280" height="90" rx="8" fill="#fff" stroke="#768397" stroke-width="1.5" /><text x="760" y="154" text-anchor="middle">网络不可用</text><text x="760" y="181" text-anchor="middle" class="small">条件与动作见转移</text></g>
<g id="d_a41b7373-2867-4803-820c-c1bba0c5fe64-offline" data-relation-id="offline"><path d="M380 135H620" class="edge" marker-end="url(#d_a41b7373-2867-4803-820c-c1bba0c5fe64-arrow)" /><text x="500" y="100" text-anchor="middle" class="small">网络变为不可用：暂停已有退避</text></g>
<g id="d_a41b7373-2867-4803-820c-c1bba0c5fe64-online" data-relation-id="online"><path d="M620 178H380" class="edge" marker-end="url(#d_a41b7373-2867-4803-820c-c1bba0c5fe64-arrow)" /><text x="500" y="232" text-anchor="middle" class="small">联网：暂停或陈旧则补偿，否则恢复排程</text></g>
<g id="d_a41b7373-2867-4803-820c-c1bba0c5fe64-automatic" data-relation-id="automatic"><path d="M900 155H950V360H760V205" class="edge" marker-end="url(#d_a41b7373-2867-4803-820c-c1bba0c5fe64-arrow)" /><text x="750" y="338" text-anchor="middle" class="small">自动意图暂停；手动可试一次，离线失败不排退避</text></g>
<text x="40" y="425" class="small">此图抽象网络门禁；offlinePaused 是补偿标记，五个模块相位不变。</text></svg>
