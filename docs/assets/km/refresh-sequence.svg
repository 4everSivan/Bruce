<svg xmlns="http://www.w3.org/2000/svg" id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6" viewBox="0 0 990 890" role="img" aria-labelledby="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-title d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-desc">
<title id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-title">macOS 单次刷新交互</title><desc id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-desc">当前源码的静态实现关系；无运行或验收断言。</desc>
<defs><style>#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}text{fill:#243247;font-size:16px}.node{fill:#fff;stroke:#768397;stroke-width:1.5}.connector{fill:none;stroke:#516176;stroke-width:1.5}.sub{font-size:13px;fill:#516176}</style>
<marker id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#516176"/></marker></defs>
<rect x="0" y="0" width="990" height="890" fill="#fff"/>
<text x="32" y="36" style="font-size:22px;font-weight:600">macOS 单次刷新交互</text><text x="32" y="65" class="sub">单次刷新主线与条件变体；输入、进程或发布失败提前返回，停止检查可取消。</text><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-scheduler" data-node-id="scheduler"><rect x="10" y="90" width="150" height="48" rx="5" class="node"/><text x="85" y="119" text-anchor="middle">Scheduler</text><line x1="85" y1="138" x2="85" y2="832" stroke="#768397" stroke-dasharray="4 5"/></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-pipeline" data-node-id="pipeline"><rect x="205" y="90" width="150" height="48" rx="5" class="node"/><text x="280" y="119" text-anchor="middle">Pipeline</text><line x1="280" y1="138" x2="280" y2="832" stroke="#768397" stroke-dasharray="4 5"/></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-inputs" data-node-id="inputs"><rect x="405" y="90" width="150" height="48" rx="5" class="node"/><text x="480" y="119" text-anchor="middle">输入与凭据</text><line x1="480" y1="138" x2="480" y2="832" stroke="#768397" stroke-dasharray="4 5"/></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-collector" data-node-id="collector"><rect x="605" y="90" width="150" height="48" rx="5" class="node"/><text x="680" y="119" text-anchor="middle">Collector</text><line x1="680" y1="138" x2="680" y2="832" stroke="#768397" stroke-dasharray="4 5"/></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-store" data-node-id="store"><rect x="805" y="90" width="150" height="48" rx="5" class="node"/><text x="880" y="119" text-anchor="middle">ArtifactStore</text><line x1="880" y1="138" x2="880" y2="832" stroke="#768397" stroke-dasharray="4 5"/></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-start" data-relation-id="start"><path d="M85 185H280" class="connector" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="70.5" y="148" width="224" height="32" fill="#fff"/><text x="182.5" y="162" text-anchor="middle" style="font-size:14px">1. 开始单次刷新</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-resolve-inputs" data-relation-id="resolve-inputs"><path d="M280 244H480" class="connector" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="268" y="207" width="224" height="32" fill="#fff"/><text x="380" y="221" text-anchor="middle" style="font-size:14px">2. 装配受控输入</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-inputs-return" data-relation-id="inputs-return"><path d="M480 303H280" class="connector" stroke-dasharray="5 4" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="268" y="266" width="224" height="32" fill="#fff"/><text x="380" y="280" text-anchor="middle" style="font-size:14px">3. 输入或失败</text><text x="380" y="295" text-anchor="middle" class="sub">失败 → 提前返回</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-previous" data-relation-id="previous"><path d="M280 362H880" class="connector" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="468" y="325" width="224" height="32" fill="#fff"/><text x="580" y="339" text-anchor="middle" style="font-size:14px">4. 读取上一份 Artifact</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-first" data-relation-id="first"><path d="M280 421H680" class="connector" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="368" y="384" width="224" height="32" fill="#fff"/><text x="480" y="398" text-anchor="middle" style="font-size:14px">5. 首次采集</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-collected" data-relation-id="collected"><path d="M680 480H280" class="connector" stroke-dasharray="5 4" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="368" y="443" width="224" height="32" fill="#fff"/><text x="480" y="457" text-anchor="middle" style="font-size:14px">6. BridgeResponse 或进程错误</text><text x="480" y="472" text-anchor="middle" class="sub">进程错误 → 提前返回</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-retry" data-relation-id="retry"><path d="M280 539H680" class="connector" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="368" y="502" width="224" height="32" fill="#fff"/><text x="480" y="516" text-anchor="middle" style="font-size:14px">7. Codex 定向重试</text><text x="480" y="531" text-anchor="middle" class="sub">可选：满足挑战恢复条件</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-retry-return" data-relation-id="retry-return"><path d="M680 598H280" class="connector" stroke-dasharray="5 4" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="368" y="561" width="224" height="32" fill="#fff"/><text x="480" y="575" text-anchor="middle" style="font-size:14px">8. 重试结果参与合并</text><text x="480" y="590" text-anchor="middle" class="sub">仅重试发生时</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-credentials" data-relation-id="credentials"><path d="M280 657H480" class="connector" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="268" y="620" width="224" height="32" fill="#fff"/><text x="380" y="634" text-anchor="middle" style="font-size:14px">9. finalize 后应用凭据更新</text><text x="380" y="649" text-anchor="middle" class="sub">可发布路径且有更新</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-publish" data-relation-id="publish"><path d="M280 716H880" class="connector" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="468" y="679" width="224" height="32" fill="#fff"/><text x="580" y="693" text-anchor="middle" style="font-size:14px">10. 发布 Artifact</text><text x="580" y="708" text-anchor="middle" class="sub">非 error 且有 Artifact</text></g><g id="d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-done" data-relation-id="done"><path d="M280 775H85" class="connector" stroke-dasharray="5 4" marker-end="url(#d_856cccba-17f1-402f-b8d2-d03c0c7de2e6-arrow)"/><rect x="70.5" y="738" width="224" height="32" fill="#fff"/><text x="182.5" y="752" text-anchor="middle" style="font-size:14px">11. 发布结果与预警候选</text><text x="182.5" y="767" text-anchor="middle" class="sub">发布失败 / 取消另行返回</text></g><text x="32" y="867" class="sub">实线：调用；虚线：返回。finalize 在凭据写回前；凭据保存失败可使 success 降为 partial。</text></svg>
