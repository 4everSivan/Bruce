<svg xmlns="http://www.w3.org/2000/svg" id="d_ac13d2c9-06bf-466a-8e98-523657c2adbf" viewBox="0 0 1000 964" role="img" aria-labelledby="d_ac13d2c9-06bf-466a-8e98-523657c2adbf-title d_ac13d2c9-06bf-466a-8e98-523657c2adbf-desc">
<title id="d_ac13d2c9-06bf-466a-8e98-523657c2adbf-title">macOS 快照读取恢复</title>
<desc id="d_ac13d2c9-06bf-466a-8e98-523657c2adbf-desc">当前、previous和一次回滚的有条件恢复</desc>
<defs><style>#d_ac13d2c9-06bf-466a-8e98-523657c2adbf{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif} text{fill:#243247;font-size:16px} .node{fill:#fff;stroke:#768397;stroke-width:1.5} .connector{fill:none;stroke:#516176;stroke-width:1.5}</style><marker id="d_ac13d2c9-06bf-466a-8e98-523657c2adbf-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#516176" /></marker></defs>
