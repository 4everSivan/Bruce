    <text x="890" y="746" class="detail">无有效 artifact</text>
  </g>
  <text x="540" y="862" class="detail">失败事件：采集异常、Error / 缺少 / 无效 artifact，或快照写入失败。</text>
  <text x="540" y="888" class="detail">静态实现视图；idle 属于快照阶段，不表示后台采集线程暂停。</text>
