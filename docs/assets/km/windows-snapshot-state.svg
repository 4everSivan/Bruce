<svg xmlns="http://www.w3.org/2000/svg" id="d_084f9330-301b-4613-bcd3-1cf561127e93" viewBox="0 0 1080 900" role="img" aria-labelledby="d_084f9330-301b-4613-bcd3-1cf561127e93-title d_084f9330-301b-4613-bcd3-1cf561127e93-desc">
  <title id="d_084f9330-301b-4613-bcd3-1cf561127e93-title">Windows 快照阶段</title>
  <desc id="d_084f9330-301b-4613-bcd3-1cf561127e93-desc">SnapshotState 的加载分支、开始刷新以及有效成功、有效部分结果、保留旧 artifact 和无 artifact 的失败分支。状态依据静态实现，idle 不表示采集线程停止。</desc>
  <defs>
    <style>
      #d_084f9330-301b-4613-bcd3-1cf561127e93 { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      #d_084f9330-301b-4613-bcd3-1cf561127e93 text { fill: #243247; font-size: 18px; text-anchor: middle; }
      #d_084f9330-301b-4613-bcd3-1cf561127e93 .node { fill: #ffffff; stroke: #768397; stroke-width: 1.5; }
      #d_084f9330-301b-4613-bcd3-1cf561127e93 .focus { fill: #fff8f5; stroke: #a13b22; stroke-width: 2; }
      #d_084f9330-301b-4613-bcd3-1cf561127e93 .connector { fill: none; stroke: #516176; stroke-width: 1.5; stroke-linejoin: round; }
      #d_084f9330-301b-4613-bcd3-1cf561127e93 .state { font-family: ui-monospace, "SFMono-Regular", Consolas, "PingFang SC", monospace; font-size: 24px; }
      #d_084f9330-301b-4613-bcd3-1cf561127e93 .detail { fill: #516176; font-size: 16px; }
      #d_084f9330-301b-4613-bcd3-1cf561127e93 .mask { fill: #ffffff; }
    </style>
    <marker id="d_084f9330-301b-4613-bcd3-1cf561127e93-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#516176"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="900" fill="#ffffff"/>
  <text x="40" y="32" style="text-anchor:start;font-size:24px">Windows 快照阶段</text>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-missing-idle" data-relation-id="missing-idle">
    <path class="connector" d="M 540 106 L 540 160" marker-end="url(#d_084f9330-301b-4613-bcd3-1cf561127e93-arrow)"/>
    <text x="596" y="138" class="detail">文件缺失</text>
  </g>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-restore-stale" data-relation-id="restore-stale">
    <path class="connector" d="M 530 96 L 40 96 L 40 724 L 80 724" marker-end="url(#d_084f9330-301b-4613-bcd3-1cf561127e93-arrow)"/>
    <text x="270" y="82" class="detail">有效文件且有 artifact</text>
  </g>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-load-failed" data-relation-id="load-failed">
    <path class="connector" d="M 550 96 L 1040 96 L 1040 724 L 1000 724" marker-end="url(#d_084f9330-301b-4613-bcd3-1cf561127e93-arrow)"/>
    <text x="812" y="58" class="detail"><tspan x="812">读取或校验失败，</tspan><tspan x="812" dy="22">或恢复无 artifact</tspan></text>
  </g>
