  </g>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-response-partial" data-relation-id="response-partial">
    <path class="connector" d="M 650 516 L 890 516 L 890 438" marker-end="url(#d_084f9330-301b-4613-bcd3-1cf561127e93-arrow)"/>
    <rect class="mask" x="696" y="500" width="160" height="30"/>
    <text x="776" y="522" class="detail">有效 Partial</text>
  </g>
