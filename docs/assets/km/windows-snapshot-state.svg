    <text x="540" y="496" class="state">refreshing</text>
    <text x="540" y="526" class="detail">正在刷新，保留旧数据</text>
  </g>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-fresh" data-node-id="fresh">
    <rect class="node" x="80" y="350" width="220" height="88" rx="8"/>
    <text x="190" y="386" class="state">fresh</text>
    <text x="190" y="416" class="detail">有效成功响应</text>
  </g>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-partial" data-node-id="partial">
    <rect class="node" x="780" y="350" width="220" height="88" rx="8"/>
    <text x="890" y="386" class="state">partial</text>
    <text x="890" y="416" class="detail">有效部分响应</text>
  </g>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-stale" data-node-id="stale">
