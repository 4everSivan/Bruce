    <text x="356" y="682" class="detail">开始刷新</text>
  </g>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-failed-begin" data-relation-id="failed-begin">
    <path class="connector" d="M 780 700 L 700 700 L 700 536 L 650 536" marker-end="url(#d_084f9330-301b-4613-bcd3-1cf561127e93-arrow)"/>
    <text x="724" y="682" class="detail">开始刷新</text>
  </g>
