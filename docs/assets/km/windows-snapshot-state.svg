  </g>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-load" data-node-id="load">
    <circle cx="540" cy="96" r="10" fill="#243247"/>
    <text x="540" y="70" class="detail">加载快照</text>
  </g>
  <g id="d_084f9330-301b-4613-bcd3-1cf561127e93-idle" data-node-id="idle">
