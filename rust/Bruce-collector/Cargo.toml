[workspace]
members = [
    "crates/collector-domain",
    "crates/collector-local",
    "crates/collector-aggregate",
    "crates/collector-runtime",
    "crates/collector-provider",
    "crates/collector-credential",
    "crates/collector-application",
    "crates/collector-bridge",
    "bin/Bruce-collector",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std"] }
chrono-tz = "=0.10.0"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
uuid = { version = "=1.11.0", features = ["v4"] }
libc = "=0.2.189"
ureq = { version = "=2.12.1", default-features = true }
url = "=2.5.4"
idna = "=1.0.3"
idna_adapter = "=1.1.0"
zeroize = "=1.8.1"
