<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>mddd Widget Visual Harness</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #080a0f;
    }
    .error {
      box-sizing: border-box;
      padding: 24px;
      color: #ffb4b4;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
<script>
(async function () {
  "use strict";

  var modules = {
    "agent-usage": {
      widget: "/agent-usage/widget/index.html",
      fixture: "/tests/fixtures/artifacts/agent-usage/valid.json"
    },
    "github": {
      widget: "/github/widget/index.html",
      fixture: "/tests/fixtures/artifacts/github/valid.json"
    },
    "gitlab": {
      widget: "/gitlab/widget/index.html",
      fixture: "/tests/fixtures/artifacts/gitlab/valid.json"
    }
  };

  function expandHeatmapWeeks(artifact) {
    if (!artifact.weeks || !artifact.weeks.length || artifact.weeks.length >= 26) return;
    var pattern = artifact.weeks.reduce(function (days, week) {
      return days.concat(week.days || []);
    }, []);
    if (!pattern.length) return;

    var start = new Date("2026-02-01T00:00:00Z");
    artifact.weeks = Array.from({length: 26}, function (_, weekIndex) {
      return {
        days: Array.from({length: 7}, function (_, weekday) {
          var source = pattern[(weekIndex * 7 + weekday) % pattern.length];
          var date = new Date(start);
          date.setUTCDate(start.getUTCDate() + weekIndex * 7 + weekday);
          return {
            date: date.toISOString().slice(0, 10),
            count: source.count,
            level: source.level,
            weekday: weekday
          };
        })
      };
    });
  }

  try {
    var params = new URLSearchParams(location.search);
    var moduleName = params.get("module") || "agent-usage";
    var deterministic = params.get("deterministic") === "1";
    var liquidGlass = params.get("theme") === "liquid-glass";
    var selected = modules[moduleName];
    if (!selected) throw new Error("Unknown module: " + moduleName);

    // 液态玻璃主题的 CSS 必须在 document.write 之前拉取:
    // 写入后页面继承 widget 的 CSP (connect-src 'none'), 无法再 fetch.
    var fetches = [fetch(selected.widget), fetch(selected.fixture)];
    if (liquidGlass) {
      fetches.push(fetch(
        "/macos/MdddApp/Sources/MdddApp/Resources/Widgets/glass-theme.css"
      ));
    }
    var responses = await Promise.all(fetches);
    if (!responses[0].ok || !responses[1].ok) throw new Error("Fixture or widget could not be loaded");
    if (liquidGlass && !responses[2].ok) throw new Error("glass-theme.css could not be loaded");
    var glassCSS = liquidGlass ? await responses[2].text() : "";

    var widgetHtml = await responses[0].text();
    var fixture = await responses[1].json();
    if (moduleName === "github" || moduleName === "gitlab") {
      expandHeatmapWeeks(fixture.artifact);
    }
    var serialized = JSON.stringify(fixture.artifact).replace(/</g, "\\u003c");
    var deterministicHead = "";
    if (deterministic) {
      // 确定性截图模式: 冻结时钟, 模拟 prefers-reduced-motion 并禁用 CSS 动画/过渡,
      // 使 countUp 直出终值, pixel 背景静止, 渲染结果可逐像素复现.
      deterministicHead = "<style>*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}</style>" +
        "<script>(function(){var RealDate=window.Date;var FROZEN=RealDate.UTC(2026,6,28,12,0,0);" +
        "function FrozenDate(){if(arguments.length===0)return new RealDate(FROZEN);" +
        "return new (Function.prototype.bind.apply(RealDate,[null].concat(Array.prototype.slice.call(arguments))))();}" +
        "FrozenDate.now=function(){return FROZEN;};FrozenDate.UTC=RealDate.UTC;FrozenDate.parse=RealDate.parse;" +
        "FrozenDate.prototype=RealDate.prototype;window.Date=FrozenDate;" +
        "var orig=window.matchMedia?window.matchMedia.bind(window):null;" +
        "window.matchMedia=function(q){if(/prefers-reduced-motion/.test(String(q))){" +
        "return{matches:true,media:q,onchange:null,addEventListener:function(){},removeEventListener:function(){}," +
        "addListener:function(){},removeListener:function(){},dispatchEvent:function(){return false;}};}" +
        "return orig?orig(q):{matches:false,media:q};};})();</scr" + "ipt>";
    }
    var bootstrap = deterministicHead + "<script>" +
      "window.DaimonWidget={" +
      "data:{main:" + serialized + "}," +
      "status:'idle'," +
      "onDataChange:function(cb){cb(this.data);}," +
      "onStatusChange:function(){}," +
      "onThemeChange:function(){}" +
      "};" +
      "</scr" + "ipt>";

    document.open();
    document.write(widgetHtml.replace("<head>", "<head>" + bootstrap));
    document.close();

    // 液态玻璃主题: 注入共享 glass-theme.css 文本 (style-src 允许 'unsafe-inline')
    // 并加 body class, 与原生侧 __mdddSetTheme("liquid-glass", cssText) 等效.
    // 不加该参数时行为完全不变 (默认 classic).
    if (liquidGlass) {
      var glassStyle = document.createElement("style");
      glassStyle.id = "mddd-glass-theme-style";
      glassStyle.textContent = glassCSS;
      document.head.appendChild(glassStyle);
      document.body.classList.add("mddd-theme-glass");
    }
  } catch (error) {
    document.body.innerHTML = "";
    var message = document.createElement("pre");
    message.className = "error";
    message.textContent = String(error && error.stack || error);
    document.body.appendChild(message);
  }
})();
</script>
</body>
</html>
